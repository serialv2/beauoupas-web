<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeauOuPas TV</title>
<link rel="stylesheet" href="css/tv.css">
<style>
  .tv-home-lang{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 4px;opacity:.85}
  .tv-home-lang-label{font-size:14px;color:inherit}
  .tv-home-lang-select{font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:inherit;cursor:pointer}
  .tv-home-lang-select option{color:#1A1612}
</style>
</head>
<body>
<div class="tv-home">
  <div>
    <div class="tv-home-logo">BeauOuPas</div>
    <div class="tv-home-tagline" id="tv-tagline">Mode TV — Soirée interactive</div>
  </div>
  <div class="tv-home-lang">
    <label class="tv-home-lang-label" for="lang-select" id="lang-label">Langue</label>
    <select id="lang-select" class="tv-home-lang-select"></select>
  </div>
  <form class="tv-home-input-group" onsubmit="return joinSeries(event)">
    <label class="tv-home-label" for="series-code" id="lbl-code">Code de la série</label>
    <input
      id="series-code"
      class="tv-home-input"
      type="text"
      maxlength="6"
      autocomplete="off"
      placeholder="------"
      autofocus>
    <button type="submit" id="join-btn" class="tv-home-button">
      Démarrer la TV
    </button>
    <div id="error-message" class="tv-home-error"></div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/tv-config.js"></script>
<script src="js/i18n.js"></script>
<script>
  var T = window.TVI18n;
  // Appliquer les textes traduits de l'écran d'accueil
  document.getElementById('tv-tagline').textContent = T.t('TvHome_Tagline');
  document.getElementById('lbl-code').textContent = T.t('TvHome_CodeLabel');
  document.getElementById('lang-label').textContent = T.t('TvHome_LangLabel');
  var joinBtn = document.getElementById('join-btn');
  joinBtn.textContent = T.t('TvHome_StartButton');

  // Construire le sélecteur de langue
  var LANG_NAMES = {
    fr: 'Français', en: 'English', de: 'Deutsch',
    es: 'Español', it: 'Italiano', nl: 'Nederlands', pt: 'Português'
  };
  var sel = document.getElementById('lang-select');
  T.SUPPORTED.forEach(function (lg) {
    var opt = document.createElement('option');
    opt.value = lg;
    opt.textContent = LANG_NAMES[lg] || lg;
    if (lg === T.getLang()) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', function () {
    T.setLang(sel.value); // mémorise + recharge la page
  });

  // Forcer le code en majuscules
  var codeInput = document.getElementById('series-code');
  codeInput.addEventListener('input', function(e) {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });
  async function joinSeries(event) {
    event.preventDefault();
    var code = codeInput.value.trim().toUpperCase();
    var errEl = document.getElementById('error-message');
    var btn = document.getElementById('join-btn');
    errEl.textContent = '';
    if (code.length !== 6) {
      errEl.textContent = T.t('TvHome_Err_CodeLength');
      return false;
    }
    btn.disabled = true;
    btn.textContent = T.t('TvHome_Verifying');
    try {
      // Créer un client Supabase léger juste pour vérifier le code
      var sb = window.supabase.createClient(
        window.TV_CONFIG.SUPABASE_URL,
        window.TV_CONFIG.SUPABASE_ANON_KEY
      );
      // ⚡ CORRECTIF : on récupère aussi quiz_style pour router
      // correctement les PARTIES RAPIDES (is_quiz = true ET
      // quiz_style = 'party'). Sans quiz_style dans le SELECT, la
      // partie rapide était routée comme un quiz Kahoot classique
      // → tv-quiz.html chargeait tv-quiz-app.js (style-kahoot) au
      // lieu de tv-party.html / tv-party-app.js → compteur de votes
      // jamais mis à jour ("0 réponse").
      var result = await sb
        .from('series')
        .select('id, title, tv_active, status, is_quiz, quiz_style')
        .eq('access_code', code)
        .maybeSingle();
      if (result.error) throw result.error;
      if (!result.data) {
        errEl.textContent = T.t('TvHome_Err_NotFound');
        btn.disabled = false;
        btn.textContent = T.t('TvHome_StartButton');
        return false;
      }
      if (!result.data.tv_active) {
        errEl.textContent = T.t('TvHome_Err_TvNotActive');
        btn.disabled = false;
        btn.textContent = T.t('TvHome_StartButton');
        return false;
      }
      // ⚡ CORRECTIF — Routage selon le type de série :
      //   1) Partie rapide : is_quiz = true ET quiz_style = 'party'
      //      → tv-party.html  (moteur PARTY, table party_answers)
      //   2) Quiz classique : is_quiz = true (sans quiz_style party)
      //      → tv-quiz.html   (moteur Kahoot, table quiz_answers)
      //   3) Mode vote/affichage : is_quiz = false
      //      → tv-display.html
      var targetPage;
      if (result.data.is_quiz && result.data.quiz_style === 'party') {
        targetPage = 'tv-party.html';
      } else if (result.data.is_quiz) {
        targetPage = 'tv-quiz.html';
      } else {
        targetPage = 'tv-display.html';
      }
      window.location.href = targetPage + '?code=' + encodeURIComponent(code);
    } catch (error) {
      console.error('joinSeries error:', error);
      errEl.textContent = T.t('TvHome_Err_Generic') + (error.message || error);
      btn.disabled = false;
      btn.textContent = T.t('TvHome_StartButton');
    }
    return false;
  }
  // Si on arrive avec un ?code= dans l'URL, on pré-remplit
  var params = new URLSearchParams(window.location.search);
  if (params.get('code')) {
    codeInput.value = params.get('code').toUpperCase();
  }
</script>
</body>
</html>
