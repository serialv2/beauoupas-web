<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeauOuPas — Voter</title>
<link rel="stylesheet" href="style.css">
<style>
.project-photo {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 18px;
  background: #111;
}
.vote-buttons {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.vote-btn {
  flex: 1;
  padding: 18px 8px;
  border-radius: 14px;
  border: 2px solid #E5DCC9;
  background: transparent;
  color: #8A6F4A;
  font-size: 26px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.vote-btn .label { font-size: 11px; color: #6B5234; font-weight: 700; }
.vote-btn.like:hover, .vote-btn.like.voted {
  border-color: #4A7A52;
  background: rgba(74,122,82,0.1);
  color: #4A7A52;
}
.vote-btn.like:hover .label, .vote-btn.like.voted .label { color: #4A7A52; }
.vote-btn.meh:hover, .vote-btn.meh.voted {
  border-color: #C9943E;
  background: rgba(201,148,62,0.1);
  color: #C9943E;
}
.vote-btn.meh:hover .label, .vote-btn.meh.voted .label { color: #C9943E; }
.vote-btn.dislike:hover, .vote-btn.dislike.voted {
  border-color: #B5482F;
  background: rgba(181,72,47,0.1);
  color: #B5482F;
}
.vote-btn.dislike:hover .label, .vote-btn.dislike.voted .label { color: #B5482F; }

.voted-badge {
  display: inline-block;
  background: rgba(74,122,82,0.15);
  color: #4A7A52;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  border: 1px solid rgba(74,122,82,0.4);
}

.nav-arrows {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 24px;
}
.nav-arrow {
  background: #FAF6EF;
  border: 1px solid #E5DCC9;
  color: white;
  padding: 12px 18px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  font-family: Arial;
}
.nav-arrow:hover:not(:disabled) { border-color: #C2754C; color: #C2754C; }
.nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }

.poll-option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  background: #111;
  border: 2px solid #E5DCC9;
  border-radius: 12px;
  color: white;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 8px;
  font-family: Arial;
}
.poll-option:hover { border-color: rgba(194,117,76,0.4); }
.poll-option.voted { border-color: #C2754C; background: rgba(194,117,76,0.1); color: #C2754C; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">BeauOuPas</div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <a href="create-group.html" class="btn btn-primary btn-full" style="margin-bottom:14px;text-decoration:none;">➕ Nouveau groupe</a>
    <div id="sidebar-user"></div>
  </div>
</aside>
<nav class="bottom-nav" id="bottom-nav"></nav>

<main class="main-content">
  <div style="max-width:600px;margin:0 auto;">

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
      <a href="javascript:history.back()" style="color:#8A6F4A;text-decoration:none;font-size:24px;">←</a>
      <h1 id="series-title" style="font-size:20px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Chargement…</h1>
    </div>

    <div id="loading"><div class="spinner"></div></div>

    <div id="content" style="display:none;">

      <!-- Indicateur "X / N" -->
      <div id="progress" style="text-align:center;margin-bottom:14px;font-size:13px;color:#8A6F4A;font-weight:700;"></div>

      <!-- Project card -->
      <div id="project-card"></div>

      <!-- Vote actions -->
      <div id="vote-area"></div>

      <!-- Navigation projets précédent/suivant -->
      <div id="nav-buttons"></div>

    </div>

    <div id="empty" style="display:none;text-align:center;padding:60px 20px;">
      <div style="font-size:64px;opacity:0.3;margin-bottom:16px;">🤷</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:6px;">Pas de projet à voter</div>
      <div style="color:#8A6F4A;font-size:13px;">Cette série n'a pas encore de projets visibles.</div>
    </div>

  </div>
</main>

<div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#FAF6EF;border:1px solid #E5DCC9;color:#3D2817;padding:14px 22px;border-radius:14px;font-weight:700;z-index:200;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="navbar.js"></script>
<script>
var currentUser = null;
var seriesId = null;
var seriesData = null;
var projects = [];           // [{ id, project_id, position, project: {...} }]
var currentIndex = 0;
var myVotes = {};            // seriesProjectId -> voteValue
var pollOptionsById = {};    // projectId -> [{id, text, position, ...}]

async function init() {
  seriesId = new URLSearchParams(window.location.search).get('id');
  if (!seriesId) {
    window.location.href = 'groups.html';
    return;
  }
  currentUser = await requireAuth();
  if (!currentUser) return;

  if (typeof renderNav === "function") renderNav("groups.html");
  if (typeof loadSidebarProfile === "function") loadSidebarProfile();

  await loadAll();
}

async function loadAll() {
  try {
    // Charger série
    var { data: s } = await db.from('series').select('*').eq('id', seriesId).maybeSingle();
    if (!s) {
      throw new Error("Série introuvable");
    }
    seriesData = s;
    document.getElementById("series-title").textContent = s.title;

    if (s.is_quiz) {
      // Rediriger vers la page de jeu quiz dédiée
      window.location.href = 'quiz-play.html?id=' + encodeURIComponent(seriesId);
      return;
    }

    if (s.status !== 'active') {
      document.getElementById("loading").innerHTML =
        '<div class="alert alert-error" style="display:block;">La série n\'est pas active. Statut actuel : ' + escapeHtml(s.status) + '</div>';
      return;
    }

    // Charger les projets de la série, dans l'ordre, qui sont revealed
    var { data: rawProjects } = await db
      .from('series_projects')
      .select('id, project_id, position, is_revealed, projects(id, title, photo_url, vote_type, photo_b_url)')
      .eq('series_id', seriesId)
      .eq('is_revealed', true)
      .order('position', { ascending: true });

    projects = rawProjects || [];

    if (!projects.length) {
      document.getElementById("loading").style.display = 'none';
      document.getElementById("empty").style.display = 'block';
      return;
    }

    // Index courant : utiliser celui de la série (avancé par l'animateur)
    currentIndex = Math.max(0, Math.min(s.current_project_index || 0, projects.length - 1));

    // Charger mes votes existants
    await loadMyVotes();

    // Pré-charger les options de sondage pour les projets de type poll
    var pollIds = projects
      .filter(function(sp) { return sp.projects && sp.projects.vote_type === 'poll'; })
      .map(function(sp) { return sp.projects.id; });
    if (pollIds.length) {
      var { data: pollOpts } = await db
        .from('poll_options')
        .select('id, project_id, text, position')
        .in('project_id', pollIds)
        .order('position', { ascending: true });
      (pollOpts || []).forEach(function(opt) {
        if (!pollOptionsById[opt.project_id]) pollOptionsById[opt.project_id] = [];
        pollOptionsById[opt.project_id].push(opt);
      });
    }

    document.getElementById("loading").style.display = 'none';
    document.getElementById("content").style.display = 'block';
    renderProject();
  } catch (e) {
    console.error("loadAll:", e);
    document.getElementById("loading").innerHTML =
      '<div class="alert alert-error" style="display:block;">Erreur : ' + escapeHtml(e.message || 'inconnue') + '</div>';
  }
}

async function loadMyVotes() {
  myVotes = {};
  try {
    var { data } = await db
      .from('series_votes')
      .select('series_project_id, vote_value')
      .eq('series_id', seriesId)
      .eq('voter_id', currentUser.id);
    (data || []).forEach(function(v) {
      myVotes[v.series_project_id] = v.vote_value;
    });
  } catch (e) {
    console.warn("loadMyVotes:", e);
  }
}

function renderProject() {
  if (!projects.length) return;

  var sp = projects[currentIndex];
  var p = sp.projects || {};
  var voteType = p.vote_type || 'photo';

  document.getElementById("progress").textContent =
    'Projet ' + (currentIndex + 1) + ' / ' + projects.length;

  var cardHtml =
    '<div class="card" style="padding:14px;">' +
      '<div style="font-size:18px;font-weight:800;margin-bottom:10px;">' +
        escapeHtml(p.title || 'Sans titre') +
      '</div>' +
      renderProjectMedia(p, voteType) +
    '</div>';
  document.getElementById("project-card").innerHTML = cardHtml;

  // Zone de vote selon type
  var myVote = myVotes[sp.id];
  var voteHtml = '<div style="margin-top:14px;">';

  if (myVote) {
    voteHtml += '<div style="text-align:center;margin-bottom:14px;">' +
      '<span class="voted-badge">✅ Tu as voté : ' + escapeHtml(formatVoteLabel(myVote, voteType)) + '</span>' +
      '</div>';
  }

  if (voteType === 'photo') {
    voteHtml += '<div class="vote-buttons">' +
      voteBtn('like', '👍', 'J\'aime', sp.id, myVote === 'like') +
      voteBtn('meh', '😐', 'Bof', sp.id, myVote === 'meh') +
      voteBtn('dislike', '👎', 'Pas pour moi', sp.id, myVote === 'dislike') +
      '</div>';
  } else if (voteType === 'duel') {
    voteHtml += '<div style="display:flex;gap:8px;margin-top:14px;">' +
      '<button type="button" class="vote-btn ' + (myVote === 'A' ? 'voted' : '') + '" ' +
              'style="border-color:' + (myVote === 'A' ? '#C2754C' : '#E5DCC9') + ';color:' + (myVote === 'A' ? '#C2754C' : '#8A6F4A') + ';" ' +
              'onclick="vote(\'' + sp.id + '\',\'A\')">' +
        '<div style="font-size:30px;">A</div>' +
        '<div class="label">Photo gauche</div>' +
      '</button>' +
      '<button type="button" class="vote-btn ' + (myVote === 'B' ? 'voted' : '') + '" ' +
              'style="border-color:' + (myVote === 'B' ? '#C2754C' : '#E5DCC9') + ';color:' + (myVote === 'B' ? '#C2754C' : '#8A6F4A') + ';" ' +
              'onclick="vote(\'' + sp.id + '\',\'B\')">' +
        '<div style="font-size:30px;">B</div>' +
        '<div class="label">Photo droite</div>' +
      '</button>' +
      '</div>';
  } else if (voteType === 'poll') {
    var opts = pollOptionsById[p.id] || [];
    if (!opts.length) {
      voteHtml += '<div style="text-align:center;color:#8A6F4A;padding:20px;">Aucune option pour ce sondage</div>';
    } else {
      voteHtml += opts.map(function(opt) {
        var voted = myVote === opt.id;
        return '<button type="button" class="poll-option ' + (voted ? 'voted' : '') + '" ' +
               'onclick="vote(\'' + sp.id + '\',\'' + opt.id + '\')">' +
                 (voted ? '✓ ' : '') + escapeHtml(opt.text) +
               '</button>';
      }).join('');
    }
  } else {
    voteHtml += '<div style="text-align:center;color:#8A6F4A;padding:20px;">Type de vote inconnu : ' + escapeHtml(voteType) + '</div>';
  }

  voteHtml += '</div>';
  document.getElementById("vote-area").innerHTML = voteHtml;

  // Navigation prev/next
  document.getElementById("nav-buttons").innerHTML =
    '<div class="nav-arrows">' +
      '<button class="nav-arrow" ' + (currentIndex <= 0 ? 'disabled' : '') + ' onclick="goPrev()">← Précédent</button>' +
      '<button class="nav-arrow" ' + (currentIndex >= projects.length - 1 ? 'disabled' : '') + ' onclick="goNext()">Suivant →</button>' +
    '</div>';
}

function renderProjectMedia(p, voteType) {
  if (voteType === 'duel' && p.photo_b_url) {
    return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
      '<img src="' + escapeHtml(p.photo_url || '') + '" alt="A" class="project-photo" style="aspect-ratio:1;">' +
      '<img src="' + escapeHtml(p.photo_b_url) + '" alt="B" class="project-photo" style="aspect-ratio:1;">' +
      '</div>';
  }
  if (p.photo_url) {
    return '<img src="' + escapeHtml(p.photo_url) + '" alt="" class="project-photo">';
  }
  return '<div style="background:#111;aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:48px;opacity:0.3;">📸</div>';
}

function voteBtn(type, emoji, label, spId, isVoted) {
  return '<button type="button" class="vote-btn ' + type + ' ' + (isVoted ? 'voted' : '') + '" ' +
         'onclick="vote(\'' + spId + '\',\'' + type + '\')">' +
    '<div>' + emoji + '</div>' +
    '<div class="label">' + label + '</div>' +
  '</button>';
}

function formatVoteLabel(v, voteType) {
  if (v === 'like') return '👍 J\'aime';
  if (v === 'meh') return '😐 Bof';
  if (v === 'dislike') return '👎 Pas pour moi';
  if (v === 'A') return 'A (gauche)';
  if (v === 'B') return 'B (droite)';
  // Sondage : on affiche le libellé de l'option
  if (voteType === 'poll') {
    var sp = projects[currentIndex];
    var p = sp.projects || {};
    var opts = pollOptionsById[p.id] || [];
    var match = opts.find(function(o) { return o.id === v; });
    if (match) return match.text;
  }
  return v;
}

async function vote(seriesProjectId, value) {
  try {
    // Upsert avec ON CONFLICT(series_project_id, voter_id) — équivalent
    // de ce que fait VoteAsync côté mobile.
    var { error } = await db
      .from('series_votes')
      .upsert({
        series_id: seriesId,
        series_project_id: seriesProjectId,
        voter_id: currentUser.id,
        vote_value: value
      }, { onConflict: 'series_project_id,voter_id' });

    if (error) {
      console.error("vote:", error);
      // Fallback : check + insert
      var { data: existing } = await db
        .from('series_votes')
        .select('id')
        .eq('series_project_id', seriesProjectId)
        .eq('voter_id', currentUser.id)
        .maybeSingle();
      if (existing) {
        // UPDATE manuel
        await db.from('series_votes')
          .update({ vote_value: value })
          .eq('id', existing.id);
      } else {
        await db.from('series_votes').insert({
          series_id: seriesId,
          series_project_id: seriesProjectId,
          voter_id: currentUser.id,
          vote_value: value
        });
      }
    }

    myVotes[seriesProjectId] = value;
    showToast("✅ Vote enregistré");
    renderProject();
  } catch (e) {
    console.error("vote:", e);
    showToast("❌ Erreur de vote");
  }
}

function goPrev() {
  if (currentIndex > 0) {
    currentIndex--;
    renderProject();
  }
}
function goNext() {
  if (currentIndex < projects.length - 1) {
    currentIndex++;
    renderProject();
  }
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2000);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

init();
</script>
</body>
</html>
