<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeauOuPas — Résultats</title>
<link rel="stylesheet" href="style.css">
<style>
.podium {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  align-items: end;
  margin-bottom: 30px;
  padding: 20px 8px 0;
}
.podium-step {
  background: #151515;
  border: 2px solid #292929;
  border-radius: 14px 14px 0 0;
  padding: 14px 8px;
  text-align: center;
  position: relative;
}
.podium-step.first {
  background: linear-gradient(135deg, #FFD700, #FFA500);
  border: 3px solid #FFD700;
  color: #5C3A00;
  padding: 22px 8px;
}
.podium-step.second {
  background: linear-gradient(135deg, #C0C0C0, #A8A8A8);
  border: 3px solid #C0C0C0;
  color: #2A2A2A;
  padding: 18px 8px;
}
.podium-step.third {
  background: linear-gradient(135deg, #CD7F32, #A0522D);
  border: 3px solid #CD7F32;
  color: white;
  padding: 16px 8px;
}
.podium-rank {
  font-size: 38px;
  font-weight: 900;
  margin-bottom: 6px;
}
.podium-step .avatar {
  width: 50px;
  height: 50px;
  margin: 0 auto 8px;
  border: 3px solid currentColor;
}
.podium-name {
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.podium-score {
  font-size: 18px;
  font-weight: 900;
}

.leaderboard-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 12px;
  margin-bottom: 6px;
}
.leaderboard-row.me {
  border-color: #E91E8C;
  background: rgba(233,30,140,0.08);
}
.lb-rank {
  font-size: 16px;
  font-weight: 900;
  color: #888;
  min-width: 36px;
  text-align: center;
}
.lb-rank.top { color: #FFD700; }
.lb-name { flex: 1; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-score {
  font-weight: 900;
  font-size: 16px;
  color: #4CAF50;
}

.empty-results {
  text-align: center;
  padding: 60px 20px;
  color: #888;
}
.empty-results .icon { font-size: 64px; opacity: 0.3; margin-bottom: 16px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">BeauOuPas</div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <a href="create-group.html" class="btn btn-primary btn-full" style="margin-bottom:14px;text-decoration:none;">➕ Nouveau groupe</a>
    <div id="sidebar-user"></div>
  </div>
</aside>
<nav class="bottom-nav" id="bottom-nav"></nav>

<main class="main-content">
  <div style="max-width:680px;margin:0 auto;">

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
      <a href="javascript:history.back()" style="color:#888;text-decoration:none;font-size:24px;">←</a>
      <h1 id="series-title" style="font-size:20px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Chargement…</h1>
    </div>

    <div id="loading"><div class="spinner"></div></div>
    <div id="content" style="display:none;"></div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="navbar.js"></script>
<script>
var seriesId = null;
var seriesData = null;
var currentUser = null;

async function init() {
  seriesId = new URLSearchParams(window.location.search).get('id');
  if (!seriesId) { window.location.href = 'groups.html'; return; }

  currentUser = await requireAuth();
  if (!currentUser) return;

  if (typeof renderNav === "function") renderNav("groups.html");
  if (typeof loadSidebarProfile === "function") loadSidebarProfile();

  await loadAll();
}

async function loadAll() {
  try {
    var { data: s } = await db.from('series').select('*').eq('id', seriesId).maybeSingle();
    if (!s) throw new Error("Série introuvable");
    seriesData = s;
    document.getElementById("series-title").textContent = '🏆 ' + (s.title || 'Résultats');

    if (s.is_quiz) {
      await loadQuizResults();
    } else {
      await loadVoteResults();
    }

    document.getElementById("loading").style.display = 'none';
    document.getElementById("content").style.display = 'block';
  } catch (e) {
    console.error("loadAll:", e);
    document.getElementById("loading").innerHTML =
      '<div class="alert alert-error" style="display:block;">❌ ' + escapeHtml(e.message || 'Erreur') + '</div>';
  }
}

// ─── Résultats QUIZ ──────────────────────────────────────
async function loadQuizResults() {
  // Tenter la RPC get_quiz_final_results
  var leaderboard = null;
  var top3 = null;

  try {
    var { data, error } = await db.rpc('get_quiz_final_results', { p_series_id: seriesId });
    if (!error && data) {
      var d = typeof data === 'string' ? JSON.parse(data) : data;
      if (Array.isArray(d)) d = d[0];
      if (d) {
        leaderboard = d.leaderboard || null;
        top3 = d.top3 || null;
      }
    }
  } catch (e) {
    console.warn("RPC get_quiz_final_results:", e);
  }

  // Fallback : calculer nous-mêmes en SQL
  if (!leaderboard) {
    leaderboard = await computeQuizLeaderboardFallback();
    if (leaderboard.length >= 3) top3 = leaderboard.slice(0, 3);
    else if (leaderboard.length > 0) top3 = leaderboard;
  }

  if (!leaderboard || !leaderboard.length) {
    document.getElementById("content").innerHTML =
      '<div class="empty-results">' +
        '<div class="icon">🤷</div>' +
        '<div style="font-size:16px;font-weight:700;color:white;">Pas de résultats</div>' +
        '<div style="font-size:13px;margin-top:6px;">Personne n\'a participé à ce quiz.</div>' +
      '</div>';
    return;
  }

  renderLeaderboard(top3 || leaderboard.slice(0, 3), leaderboard,
    seriesData.show_full_leaderboard !== false);
}

async function computeQuizLeaderboardFallback() {
  // 1. Récupérer toutes les réponses du quiz
  var { data: answers } = await db
    .from('quiz_answers')
    .select('user_id, is_correct, response_time_ms')
    .eq('series_id', seriesId);
  if (!answers || !answers.length) return [];

  // 2. Agréger par user_id
  var byUser = {};
  answers.forEach(function(a) {
    if (!byUser[a.user_id]) {
      byUser[a.user_id] = { user_id: a.user_id, score: 0, total_time: 0, answer_count: 0 };
    }
    var u = byUser[a.user_id];
    if (a.is_correct) u.score++;
    u.total_time += (a.response_time_ms || 0);
    u.answer_count++;
  });

  // 3. Charger les profils
  var userIds = Object.keys(byUser);
  var { data: profiles } = await db
    .from('profiles')
    .select('id, username, avatar_url')
    .in('id', userIds);

  var profById = {};
  (profiles || []).forEach(function(p) { profById[p.id] = p; });

  // 4. Construire le tableau et trier (score DESC, puis total_time ASC pour départager)
  var arr = Object.values(byUser).map(function(u) {
    var p = profById[u.user_id] || {};
    return {
      user_id: u.user_id,
      username: p.username || 'Inconnu',
      avatar_url: p.avatar_url,
      score: u.score,
      total_time_ms: u.total_time
    };
  });
  arr.sort(function(a, b) {
    if (b.score !== a.score) return b.score - a.score;
    return a.total_time_ms - b.total_time_ms;
  });

  return arr;
}

// ─── Résultats VOTE ──────────────────────────────────────
async function loadVoteResults() {
  // Pour les séries de votes : on liste les projets avec leurs scores agrégés.
  var { data: rawProjects } = await db
    .from('series_projects')
    .select('id, project_id, position, projects(id, title, photo_url, vote_type)')
    .eq('series_id', seriesId)
    .order('position', { ascending: true });

  if (!rawProjects || !rawProjects.length) {
    document.getElementById("content").innerHTML =
      '<div class="empty-results"><div class="icon">📊</div><div style="font-size:16px;font-weight:700;color:white;">Aucun projet</div></div>';
    return;
  }

  // Charger tous les votes de la série
  var spIds = rawProjects.map(function(sp) { return sp.id; });
  var { data: rawVotes } = await db
    .from('series_votes')
    .select('series_project_id, vote_value')
    .in('series_project_id', spIds);

  // Compter par projet
  var counters = {};
  rawProjects.forEach(function(sp) {
    counters[sp.id] = { likes: 0, mehs: 0, dislikes: 0, A: 0, B: 0, total: 0 };
  });
  (rawVotes || []).forEach(function(v) {
    var c = counters[v.series_project_id];
    if (!c) return;
    c.total++;
    if (v.vote_value === 'like') c.likes++;
    else if (v.vote_value === 'meh') c.mehs++;
    else if (v.vote_value === 'dislike') c.dislikes++;
    else if (v.vote_value === 'A') c.A++;
    else if (v.vote_value === 'B') c.B++;
  });

  // Calcul score : likes - dislikes pour photo, max(A,B) pour duel
  var scored = rawProjects.map(function(sp) {
    var c = counters[sp.id];
    var p = sp.projects || {};
    var voteType = p.vote_type || 'photo';
    var score = 0;
    if (voteType === 'photo') {
      score = c.likes - c.dislikes;
    } else if (voteType === 'duel') {
      score = Math.max(c.A, c.B);
    } else {
      score = c.total;
    }
    return {
      project_id: p.id,
      title: p.title || 'Sans titre',
      photo_url: p.photo_url,
      vote_type: voteType,
      counters: c,
      score: score
    };
  });

  scored.sort(function(a, b) { return b.score - a.score; });

  // Afficher
  var html = '<div style="font-size:13px;color:#888;margin-bottom:14px;">' +
    'Classement des projets par score (likes − dislikes pour les photos)' +
    '</div>';
  html += scored.map(function(p, i) {
    var rank = i + 1;
    var rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '#' + rank;
    var thumb = p.photo_url
      ? '<img src="' + escapeHtml(p.photo_url) + '" style="width:50px;height:50px;border-radius:10px;object-fit:cover;flex-shrink:0;">'
      : '<div style="width:50px;height:50px;border-radius:10px;background:#222;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">📸</div>';

    var details = '';
    if (p.vote_type === 'photo') {
      details = '👍 ' + p.counters.likes + ' · 😐 ' + p.counters.mehs + ' · 👎 ' + p.counters.dislikes;
    } else if (p.vote_type === 'duel') {
      details = 'A : ' + p.counters.A + ' · B : ' + p.counters.B;
    } else {
      details = p.counters.total + ' vote' + (p.counters.total > 1 ? 's' : '');
    }

    return (
      '<div class="leaderboard-row">' +
        '<div class="lb-rank ' + (rank <= 3 ? 'top' : '') + '">' + rankIcon + '</div>' +
        thumb +
        '<div style="flex:1;min-width:0;">' +
          '<div class="lb-name">' + escapeHtml(p.title) + '</div>' +
          '<div style="font-size:11px;color:#888;margin-top:2px;">' + details + '</div>' +
        '</div>' +
        '<div class="lb-score">' + (p.score >= 0 ? '+' : '') + p.score + '</div>' +
      '</div>'
    );
  }).join('');

  document.getElementById("content").innerHTML = html;
}

// ─── Rendu du leaderboard quiz ────────────────────────────
function renderLeaderboard(top3, leaderboard, showFull) {
  var html = '';

  // Podium top 3 (slots vides si moins de 3 joueurs)
  if (top3 && top3.length > 0) {
    // On affiche dans l'ordre 2-1-3 pour visuel "podium"
    var slot1 = top3[0];
    var slot2 = top3[1];
    var slot3 = top3[2];

    html += '<div class="podium">' +
      podiumStep(slot2, 2, 'second') +
      podiumStep(slot1, 1, 'first') +
      podiumStep(slot3, 3, 'third') +
    '</div>';
  }

  // Leaderboard complet (si activé)
  if (showFull && leaderboard.length > 0) {
    html += '<div style="margin-top:8px;font-size:14px;font-weight:800;color:#888;margin-bottom:10px;">CLASSEMENT COMPLET</div>';
    html += leaderboard.map(function(u, i) {
      var rank = i + 1;
      var rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '#' + rank;
      var firstLetter = (u.username || '?')[0].toUpperCase();
      var avatarContent = u.avatar_url
        ? '<img src="' + escapeHtml(u.avatar_url) + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'
        : firstLetter;

      var isMe = u.user_id === currentUser.id;
      return (
        '<div class="leaderboard-row ' + (isMe ? 'me' : '') + '">' +
          '<div class="lb-rank ' + (rank <= 3 ? 'top' : '') + '">' + rankIcon + '</div>' +
          '<div class="avatar" style="width:36px;height:36px;font-size:13px;">' + avatarContent + '</div>' +
          '<div class="lb-name">@' + escapeHtml(u.username) + (isMe ? ' (toi)' : '') + '</div>' +
          '<div class="lb-score">' + (u.score || 0) + ' pt' + ((u.score || 0) > 1 ? 's' : '') + '</div>' +
        '</div>'
      );
    }).join('');
  } else if (!showFull) {
    html += '<div style="text-align:center;color:#888;font-size:13px;margin-top:18px;">Le classement complet est désactivé pour ce quiz.</div>';
  }

  document.getElementById("content").innerHTML = html;
}

function podiumStep(player, rank, cssClass) {
  if (!player) {
    return '<div class="podium-step ' + cssClass + '" style="opacity:0.3;"><div class="podium-rank">#' + rank + '</div><div style="font-size:12px;">--</div></div>';
  }
  var firstLetter = (player.username || '?')[0].toUpperCase();
  var avatarContent = player.avatar_url
    ? '<img src="' + escapeHtml(player.avatar_url) + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'
    : firstLetter;
  var rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : '🥉';
  return (
    '<div class="podium-step ' + cssClass + '">' +
      '<div class="podium-rank">' + rankIcon + '</div>' +
      '<div class="avatar">' + avatarContent + '</div>' +
      '<div class="podium-name">@' + escapeHtml(player.username || '?') + '</div>' +
      '<div class="podium-score">' + (player.score || 0) + ' pt' + ((player.score || 0) > 1 ? 's' : '') + '</div>' +
    '</div>'
  );
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

init();
</script>
</body>
</html>
