<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeauOuPas — Détail série</title>
<link rel="stylesheet" href="style.css">
<style>
.tab-row {
  display: flex;
  gap: 6px;
  background: #111;
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 18px;
}
.tab-btn {
  flex: 1;
  padding: 10px 12px;
  background: transparent;
  border: none;
  color: #8A6F4A;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.15s;
  font-family: Arial;
}
.tab-btn.active { background: #C2754C; color: white; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.code-display {
  text-align: center;
  padding: 18px;
  background: linear-gradient(135deg, rgba(194,117,76,0.1), rgba(107,127,92,0.1));
  border: 2px dashed rgba(194,117,76,0.5);
  border-radius: 16px;
  margin-bottom: 18px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.code-display:hover { border-color: rgba(194,117,76,0.9); }
.code-display .label { font-size: 11px; color: #8A6F4A; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.code-display .value { font-size: 36px; color: #C2754C; font-weight: 900; letter-spacing: 8px; font-family: monospace; margin: 6px 0 4px; }
.code-display .hint { font-size: 11px; color: #8A6F4A; }

.row-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: #111;
  border: 1px solid #E5DCC9;
  border-radius: 12px;
  margin-bottom: 8px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.status-preparing { background: rgba(201,148,62,0.15); color: #C9943E; border: 1px solid rgba(201,148,62,0.4); }
.status-active { background: rgba(74,122,82,0.15); color: #4A7A52; border: 1px solid rgba(74,122,82,0.4); }
.status-finished { background: rgba(102,102,102,0.15); color: #8A6F4A; border: 1px solid rgba(102,102,102,0.4); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">BeauOuPas</div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <a href="create-group.html" class="btn btn-primary btn-full" style="margin-bottom:14px;text-decoration:none;">➕ Nouveau groupe</a>
    <div id="sidebar-user"></div>
  </div>
</aside>
<nav class="bottom-nav" id="bottom-nav"></nav>

<main class="main-content">
  <div style="max-width:700px;margin:0 auto;">

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
      <a href="javascript:history.back()" style="color:#8A6F4A;text-decoration:none;font-size:24px;">←</a>
      <h1 id="series-title" style="font-size:22px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Chargement…</h1>
    </div>

    <div id="series-loading"><div class="spinner"></div></div>
    <div id="series-content" style="display:none;">

      <!-- Header avec status -->
      <div id="series-header"></div>

      <!-- Code à partager -->
      <div id="series-code"></div>

      <!-- Tabs -->
      <div class="tab-row">
        <button class="tab-btn active" data-tab="info" onclick="switchTab('info')">ℹ️ Infos</button>
        <button class="tab-btn" data-tab="participants" onclick="switchTab('participants')">👥 Participants</button>
        <button class="tab-btn" data-tab="projects" onclick="switchTab('projects')">📸 Projets</button>
      </div>

      <!-- Tab Infos -->
      <div class="tab-content active" id="tab-info">
        <div class="card" style="padding:18px;">
          <div id="series-info-list"></div>
        </div>
      </div>

      <!-- Tab Participants -->
      <div class="tab-content" id="tab-participants">
        <div id="participants-list"></div>
      </div>

      <!-- Tab Projets -->
      <div class="tab-content" id="tab-projects">
        <div id="projects-list"></div>
      </div>

      <!-- Actions -->
      <div id="series-actions" style="margin-top:24px;"></div>

    </div>

  </div>
</main>

<div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#FAF6EF;border:1px solid #E5DCC9;color:#3D2817;padding:14px 22px;border-radius:14px;font-weight:700;z-index:200;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="navbar.js"></script>
<script>
var currentUser = null;
var seriesId = null;
var seriesData = null;       // { ...series fields }
var participants = [];        // [{ user_id, username, avatar_url, project_count }]
var projects = [];            // [{ ...series_project, project: {...} }]
var isCreator = false;

async function init() {
  seriesId = new URLSearchParams(window.location.search).get('id');
  if (!seriesId) {
    window.location.href = 'groups.html';
    return;
  }

  currentUser = await requireAuth();
  if (!currentUser) return;

  if (typeof renderNav === "function") renderNav("groups.html");
  if (typeof loadSidebarProfile === "function") loadSidebarProfile();

  await loadAll();
}

async function loadAll() {
  try {
    // Tenter la RPC get_series_detail_full
    var rpcOk = false;
    try {
      var { data, error } = await db.rpc('get_series_detail_full', {
        p_series_id: seriesId,
        p_user_id: currentUser.id
      });
      if (!error && data) {
        var d = Array.isArray(data) ? data[0] : data;
        if (d && d.series) {
          applyDetail(d);
          rpcOk = true;
        }
      }
    } catch (e) {
      console.warn("RPC get_series_detail_full:", e);
    }

    if (!rpcOk) {
      await loadFallback();
    }

    document.getElementById("series-loading").style.display = 'none';
    document.getElementById("series-content").style.display = 'block';

  } catch (e) {
    console.error("loadAll:", e);
    document.getElementById("series-loading").innerHTML =
      '<div class="alert alert-error" style="display:block;">Impossible de charger la série</div>';
  }
}

function applyDetail(d) {
  seriesData = d.series;
  participants = d.participants || [];
  projects = d.projects || [];
  isCreator = seriesData.creator_id === currentUser.id;
  renderAll();
}

async function loadFallback() {
  // 1. série
  var { data: s } = await db.from('series').select('*').eq('id', seriesId).maybeSingle();
  if (!s) {
    throw new Error("Série introuvable");
  }
  seriesData = s;
  isCreator = s.creator_id === currentUser.id;

  // 2. participants
  var { data: rawParts } = await db
    .from('series_participants')
    .select('user_id, joined_at, profiles!inner(id, username, avatar_url)')
    .eq('series_id', seriesId);
  participants = (rawParts || []).map(function(p) {
    return {
      user_id: p.user_id,
      username: p.profiles ? p.profiles.username : 'Inconnu',
      avatar_url: p.profiles ? p.profiles.avatar_url : null,
      project_count: 0
    };
  });

  // 3. projets de la série + jointure projet réel
  var { data: rawProjects } = await db
    .from('series_projects')
    .select('id, project_id, added_by, position, is_revealed, projects(id, title, photo_url)')
    .eq('series_id', seriesId)
    .order('position', { ascending: true });
  projects = rawProjects || [];

  // Compteur de projets par membre
  var byMember = {};
  projects.forEach(function(p) {
    if (!byMember[p.added_by]) byMember[p.added_by] = 0;
    byMember[p.added_by]++;
  });
  participants.forEach(function(p) {
    p.project_count = byMember[p.user_id] || 0;
  });

  renderAll();
}

function renderAll() {
  document.getElementById("series-title").textContent = seriesData.title || 'Série';
  renderHeader();
  renderCode();
  renderInfo();
  renderParticipants();
  renderProjects();
  renderActions();
}

function renderHeader() {
  var statusLabel = '';
  var statusClass = '';
  if (seriesData.status === 'preparing') { statusLabel = '⏳ En préparation'; statusClass = 'status-preparing'; }
  else if (seriesData.status === 'active') { statusLabel = '🔥 En cours'; statusClass = 'status-active'; }
  else if (seriesData.status === 'finished') { statusLabel = '✅ Terminée'; statusClass = 'status-finished'; }
  else { statusLabel = seriesData.status; statusClass = 'status-finished'; }

  var html =
    '<div class="card" style="padding:18px;margin-bottom:14px;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap;">' +
        '<div style="font-size:18px;font-weight:800;">' + (seriesData.is_quiz ? '🧠' : '🗳️') + ' ' + escapeHtml(seriesData.title) + '</div>' +
        '<span class="status-pill ' + statusClass + '">' + statusLabel + '</span>' +
      '</div>' +
      (seriesData.description
        ? '<div style="color:#8A6F4A;font-size:13px;line-height:1.5;">' + escapeHtml(seriesData.description) + '</div>'
        : '') +
      (isCreator ? '<div style="margin-top:8px;font-size:11px;"><span class="badge badge-pink">👑 Créateur</span></div>' : '') +
    '</div>';
  document.getElementById("series-header").innerHTML = html;
}

function renderCode() {
  if (!seriesData.access_code) {
    document.getElementById("series-code").innerHTML = '';
    return;
  }
  document.getElementById("series-code").innerHTML =
    '<div class="code-display" onclick="copyCode()">' +
      '<div class="label">CODE À PARTAGER</div>' +
      '<div class="value">' + escapeHtml(seriesData.access_code) + '</div>' +
      '<div class="hint">Clique pour copier</div>' +
    '</div>';
}

function copyCode() {
  if (!seriesData.access_code) return;
  navigator.clipboard.writeText(seriesData.access_code).then(function() {
    showToast("✅ Code copié : " + seriesData.access_code);
  }).catch(function() {
    showToast("⚠️ Copie impossible — sélectionne le code à la main");
  });
}

function renderInfo() {
  var rows = [];
  rows.push(['📸 Max projets', seriesData.max_projects + ' au total']);
  rows.push(['👤 Par membre', seriesData.max_per_member === 999 ? 'Illimité' : seriesData.max_per_member]);
  rows.push(['🎁 Effet surprise', seriesData.projects_hidden ? 'Activé' : 'Désactivé']);
  rows.push(['📊 Stats détaillées', seriesData.show_stats !== false ? 'Activées' : 'Désactivées']);
  rows.push(['⏱️ Durée vote', (seriesData.vote_duration_seconds || 20) + ' s']);
  rows.push(['📅 Créée le', formatDate(seriesData.created_at)]);

  document.getElementById("series-info-list").innerHTML = rows.map(function(r) {
    return (
      '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #E5DCC9;">' +
        '<span style="color:#8A6F4A;font-size:13px;">' + escapeHtml(r[0]) + '</span>' +
        '<span style="font-weight:700;font-size:13px;">' + escapeHtml(String(r[1])) + '</span>' +
      '</div>'
    );
  }).join('');
}

function renderParticipants() {
  var listEl = document.getElementById("participants-list");
  if (!participants.length) {
    listEl.innerHTML = '<div style="text-align:center;color:#6B5234;padding:30px;font-size:13px;">Aucun participant pour l\'instant</div>';
    return;
  }
  listEl.innerHTML = participants.map(function(p) {
    var firstLetter = (p.username || '?')[0].toUpperCase();
    var avatarContent = p.avatar_url
      ? '<img src="' + escapeHtml(p.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'
      : firstLetter;
    return (
      '<div class="row-card">' +
        '<div class="avatar" style="width:38px;height:38px;font-size:14px;">' + avatarContent + '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-weight:700;">@' + escapeHtml(p.username) + '</div>' +
          '<div style="font-size:11px;color:#8A6F4A;">📸 ' + (p.project_count || 0) + ' projet' + ((p.project_count || 0) > 1 ? 's' : '') + '</div>' +
        '</div>' +
        (p.user_id === seriesData.creator_id ? '<span class="badge badge-pink">CRÉATEUR</span>' : '') +
      '</div>'
    );
  }).join('');
}

function renderProjects() {
  var listEl = document.getElementById("projects-list");
  // Si projets cachés et pas créateur et série pas active → on cache
  var canSeeProjects = isCreator
    || seriesData.status === 'active'
    || seriesData.status === 'finished'
    || !seriesData.projects_hidden;

  if (!canSeeProjects) {
    listEl.innerHTML =
      '<div style="text-align:center;padding:30px 20px;color:#8A6F4A;font-size:13px;">' +
        '🎁 Les projets sont cachés jusqu\'au démarrage<br>' +
        '<span style="font-size:11px;color:#6B5234;">' + projects.length + ' projet' + (projects.length > 1 ? 's' : '') + ' déjà ajouté' + (projects.length > 1 ? 's' : '') + '</span>' +
      '</div>';
    return;
  }

  if (!projects.length) {
    listEl.innerHTML =
      '<div style="text-align:center;padding:30px 20px;color:#6B5234;font-size:13px;">' +
        'Aucun projet pour l\'instant.<br>' +
        '<span style="font-size:11px;">Limite : ' + seriesData.max_projects + ' projets max</span>' +
      '</div>';
    return;
  }

  listEl.innerHTML = projects.map(function(sp, i) {
    var p = sp.project || sp.projects || null;
    var title = (p && p.title) || 'Projet sans titre';
    var photo = p && p.photo_url ? p.photo_url : null;
    var thumb = photo
      ? '<img src="' + escapeHtml(photo) + '" alt="" style="width:54px;height:54px;border-radius:10px;object-fit:cover;">'
      : '<div style="width:54px;height:54px;border-radius:10px;background:#E5DCC9;display:flex;align-items:center;justify-content:center;font-size:22px;">📸</div>';

    return (
      '<div class="row-card">' +
        thumb +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">#' + (i + 1) + ' ' + escapeHtml(title) + '</div>' +
          (sp.is_revealed === false ? '<div style="font-size:11px;color:#C9943E;">🎁 caché</div>' : '') +
        '</div>' +
      '</div>'
    );
  }).join('');
}

function renderActions() {
  var html = '';

  if (isCreator) {
    if (seriesData.status === 'preparing') {
      // Bouton spécifique aux quiz : éditer les questions avant de démarrer
      if (seriesData.is_quiz) {
        html += '<a href="edit-quiz-questions.html?id=' + encodeURIComponent(seriesId) + '" class="btn btn-secondary btn-full" style="text-decoration:none;margin-bottom:8px;">📝 Éditer les questions</a>';
      } else {
        // ⚡ Lot 4 : bouton ajouter un projet (créateur ET membres) si non-quiz
        html += '<a href="add-project-to-series.html?series_id=' + encodeURIComponent(seriesId) + '" class="btn btn-secondary btn-full" style="text-decoration:none;margin-bottom:8px;">➕ Ajouter un projet</a>';
      }
      html += '<button class="btn btn-primary btn-full" style="margin-bottom:8px;" onclick="startSeries()">▶️ Démarrer la série</button>';
    } else if (seriesData.status === 'active') {
      // Pour les quiz, le créateur peut aussi aller jouer (voir l'écran joueur en parallèle de la TV)
      if (seriesData.is_quiz) {
        html += '<a href="quiz-play.html?id=' + encodeURIComponent(seriesId) + '" class="btn btn-primary btn-full" style="text-decoration:none;margin-bottom:8px;">🧠 Voir l\'écran joueur</a>';
      }
      html += '<button class="btn btn-secondary btn-full" style="margin-bottom:8px;" onclick="stopSeries()">⏹️ Arrêter la série</button>';
    } else if (seriesData.status === 'finished') {
      html += '<a href="series-results.html?id=' + encodeURIComponent(seriesId) + '" class="btn btn-primary btn-full" style="text-decoration:none;margin-bottom:8px;">🏆 Voir les résultats</a>';
      html += '<button class="btn btn-secondary btn-full" style="margin-bottom:8px;" onclick="resetSeries()">🔄 Repréparer</button>';
    }
    html += '<button class="btn btn-ghost btn-full" style="border-color:rgba(181,72,47,0.4);color:#B5482F;" onclick="deleteSeries()">🗑️ Supprimer la série</button>';
  } else {
    // Non créateur
    if (seriesData.status === 'preparing' && !seriesData.is_quiz) {
      // ⚡ Lot 4 : les membres peuvent aussi ajouter des projets en preparing (sauf pour les quiz)
      html += '<a href="add-project-to-series.html?series_id=' + encodeURIComponent(seriesId) + '" class="btn btn-primary btn-full" style="text-decoration:none;margin-bottom:8px;">➕ Ajouter un projet</a>';
    } else if (seriesData.status === 'active') {
      var voteUrl = seriesData.is_quiz
        ? 'quiz-play.html?id=' + encodeURIComponent(seriesId)
        : 'series-vote.html?id=' + encodeURIComponent(seriesId);
      var voteLabel = seriesData.is_quiz ? '🧠 Jouer le quiz' : '🗳️ Aller voter';
      html += '<a href="' + voteUrl + '" class="btn btn-primary btn-full" style="text-decoration:none;margin-bottom:8px;">' + voteLabel + '</a>';
    } else if (seriesData.status === 'finished') {
      html += '<a href="series-results.html?id=' + encodeURIComponent(seriesId) + '" class="btn btn-primary btn-full" style="text-decoration:none;margin-bottom:8px;">🏆 Voir les résultats</a>';
    }
    html += '<button class="btn btn-ghost btn-full" style="border-color:rgba(181,72,47,0.4);color:#B5482F;" onclick="leaveSeries()">🚪 Quitter la série</button>';
  }

  document.getElementById("series-actions").innerHTML = html;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-content').forEach(function(c) {
    c.classList.toggle('active', c.id === 'tab-' + tab);
  });
}

// ─── Actions admin ───────────────────────────────────────
async function startSeries() {
  if (!confirm("Démarrer la série maintenant ?\nLes projets ne pourront plus être ajoutés/modifiés.")) return;

  try {
    // Reproduire ce que fait StartSeriesAsync : reveal + status active + index=0
    await db.from('series_projects').update({ is_revealed: true }).eq('series_id', seriesId);
    var { error } = await db.from('series')
      .update({ status: 'active', current_project_index: 0 })
      .eq('id', seriesId);
    if (error) throw error;

    showToast("✅ Série démarrée !");
    await loadAll();
  } catch (e) {
    console.error("startSeries:", e);
    showToast("❌ Erreur : " + (e.message || 'inconnue'));
  }
}

async function stopSeries() {
  if (!confirm("Arrêter la série ?\nElle passera en \"Terminée\".")) return;

  try {
    var { error } = await db.from('series')
      .update({ status: 'finished' })
      .eq('id', seriesId);
    if (error) throw error;

    showToast("✅ Série arrêtée");
    await loadAll();
  } catch (e) {
    console.error("stopSeries:", e);
    showToast("❌ Erreur");
  }
}

async function resetSeries() {
  if (!confirm("Repréparer la série ?\nLes votes et résultats actuels seront effacés mais les projets et participants seront conservés.")) return;

  try {
    // RPC reset_series_for_replay
    var { error } = await db.rpc('reset_series_for_replay', {
      p_series_id: seriesId,
      p_user_id: currentUser.id
    });
    if (error) {
      console.warn("RPC reset:", error);
      // Fallback minimaliste si la RPC est absente
      await db.from('series').update({
        status: 'preparing',
        current_project_index: 0,
        tv_active: false,
        tv_paused: false
      }).eq('id', seriesId);
    }

    showToast("✅ Série repréparée");
    await loadAll();
  } catch (e) {
    console.error("resetSeries:", e);
    showToast("❌ Erreur");
  }
}

async function deleteSeries() {
  if (!confirm("⚠️ Supprimer DÉFINITIVEMENT cette série ?\n\nTous les projets, votes et participants seront perdus.")) return;

  try {
    // RPC delete_series_safe (déjà utilisée par le mobile)
    var { data, error } = await db.rpc('delete_series_safe', {
      p_series_id: seriesId,
      p_user_id: currentUser.id
    });

    if (error) {
      console.error("delete_series_safe:", error);
      showToast("❌ " + error.message);
      return;
    }

    var d = Array.isArray(data) ? data[0] : data;
    if (d && d.success === false) {
      showToast("❌ " + (d.message || "Échec"));
      return;
    }

    showToast("✅ Série supprimée");
    setTimeout(function() {
      // Retour vers le groupe ou vers groups.html
      if (seriesData.group_id) {
        window.location.href = 'group-detail.html?id=' + encodeURIComponent(seriesData.group_id);
      } else {
        window.location.href = 'groups.html';
      }
    }, 800);
  } catch (e) {
    console.error("deleteSeries:", e);
    showToast("❌ Erreur");
  }
}

async function leaveSeries() {
  if (!confirm("Quitter cette série ?")) return;

  try {
    var { error } = await db
      .from('series_participants')
      .delete()
      .eq('series_id', seriesId)
      .eq('user_id', currentUser.id);
    if (error) throw error;

    showToast("✅ Tu as quitté la série");
    setTimeout(function() {
      if (seriesData.group_id) {
        window.location.href = 'group-detail.html?id=' + encodeURIComponent(seriesData.group_id);
      } else {
        window.location.href = 'groups.html';
      }
    }, 800);
  } catch (e) {
    console.error("leaveSeries:", e);
    showToast("❌ Erreur");
  }
}

// ─── Utils ────────────────────────────────────────────────
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2500);
}

function formatDate(iso) {
  if (!iso) return '?';
  try {
    var d = new Date(iso);
    return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
  } catch(e) { return '?'; }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

init();
</script>
</body>
</html>
