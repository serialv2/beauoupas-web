<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeauOuPas — Nouveau groupe</title>
<link rel="stylesheet" href="style.css">
<style>
.friend-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: #111;
  border: 2px solid #292929;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 8px;
  user-select: none;
}
.friend-row:hover { border-color: rgba(233,30,140,0.3); }
.friend-row.selected {
  border-color: #E91E8C;
  background: rgba(233,30,140,0.06);
}
.friend-row .check {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  transition: all 0.15s;
}
.friend-row.selected .check {
  background: #E91E8C;
  border-color: #E91E8C;
  color: white;
}
.tool-btn {
  background: transparent;
  border: 1px solid #292929;
  color: #888;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  transition: all 0.15s;
  font-family: Arial;
}
.tool-btn:hover { border-color: #E91E8C; color: #E91E8C; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">BeauOuPas</div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <a href="create-group.html" class="btn btn-primary btn-full" style="margin-bottom:14px;text-decoration:none;">➕ Nouveau groupe</a>
    <div id="sidebar-user"></div>
  </div>
</aside>
<nav class="bottom-nav" id="bottom-nav"></nav>

<main class="main-content">
  <div style="max-width:600px;margin:0 auto;">

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:24px;">
      <a href="groups.html" style="color:#888;text-decoration:none;font-size:24px;">←</a>
      <h1 style="font-size:24px;font-weight:900;">➕ Nouveau groupe</h1>
    </div>

    <div class="alert alert-error" id="error-msg"></div>
    <div class="alert alert-success" id="success-msg"></div>

    <div class="card" style="padding:20px;margin-bottom:18px;">
      <label class="input-label">Nom du groupe *</label>
      <input type="text" class="input" id="group-name" placeholder="Ex. Foodies Lyon" maxlength="50" autofocus>

      <div style="height:14px;"></div>

      <label class="input-label">Description (optionnelle)</label>
      <input type="text" class="input" id="group-description" placeholder="À quoi sert ce groupe ?" maxlength="200">
    </div>

    <div class="card" style="padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
        <h2 style="font-size:16px;font-weight:800;">Inviter des amis</h2>
        <span id="selected-count" style="font-size:13px;color:#888;">0 sélectionné</span>
      </div>

      <!-- Recherche + tout sélectionner -->
      <div id="friends-tools" style="display:none;margin-bottom:12px;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input type="text" class="input" id="search-input" placeholder="🔎 Rechercher un ami…"
                 style="flex:1;min-width:180px;padding:10px 14px;font-size:14px;"
                 oninput="renderFriends()">
          <button type="button" class="tool-btn" onclick="toggleAll()">
            <span id="select-all-label">✓ Tous</span>
          </button>
        </div>
      </div>

      <div id="friends-list">
        <div class="spinner" style="margin:30px auto;"></div>
      </div>
    </div>

    <button class="btn btn-primary btn-full" style="margin-top:20px;" id="btn-create" onclick="createGroup()">
      Créer le groupe
    </button>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="navbar.js"></script>
<script>
var currentUser = null;
var friends = [];        // tous les amis acceptés (profils)
var selected = new Set(); // user_ids cochés

async function init() {
  currentUser = await requireAuth();
  if (!currentUser) return;

  if (typeof renderNav === "function") renderNav("groups.html");
  if (typeof loadSidebarProfile === "function") loadSidebarProfile();

  await loadFriends();
}

async function loadFriends() {
  var listEl = document.getElementById("friends-list");

  try {
    // ⚡ FIX BUG : la table 'friendships' utilise les colonnes
    // `requester_id` + `receiver_id`, pas `addressee_id` (vérifié dans
    // Models/FriendshipModel.cs côté mobile et dans friends.html du web).
    // L'ancienne requête échouait silencieusement → la liste apparaissait vide.
    var { data: rows1, error: e1 } = await db
      .from('friendships')
      .select('receiver_id')
      .eq('requester_id', currentUser.id)
      .eq('status', 'accepted');

    var { data: rows2, error: e2 } = await db
      .from('friendships')
      .select('requester_id')
      .eq('receiver_id', currentUser.id)
      .eq('status', 'accepted');

    if (e1) console.warn("friendships sent:", e1);
    if (e2) console.warn("friendships received:", e2);

    var friendIds = [];
    (rows1 || []).forEach(function(r) { if (r.receiver_id) friendIds.push(r.receiver_id); });
    (rows2 || []).forEach(function(r) { if (r.requester_id) friendIds.push(r.requester_id); });
    friendIds = Array.from(new Set(friendIds));

    if (!friendIds.length) {
      listEl.innerHTML =
        '<div style="text-align:center;padding:30px 10px;color:#666;font-size:14px;">' +
          '👋 Tu n\'as pas encore d\'amis.<br>' +
          '<a href="friends.html" style="color:#E91E8C;text-decoration:none;font-weight:700;">Ajoute des amis ici</a><br>' +
          '<span style="font-size:12px;">Tu pourras quand même créer un groupe seul</span>' +
        '</div>';
      return;
    }

    // 1 seule requête pour tous les profils (vs N+1 du mobile)
    var { data: profiles, error: pErr } = await db
      .from('profiles')
      .select('id, username, avatar_url')
      .in('id', friendIds);

    if (pErr) {
      console.error("profiles:", pErr);
      listEl.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">Impossible de charger les profils</div>';
      return;
    }

    friends = (profiles || []).sort(function(a, b) {
      return (a.username || '').toLowerCase().localeCompare((b.username || '').toLowerCase());
    });

    document.getElementById("friends-tools").style.display = 'block';
    renderFriends();
  } catch (e) {
    console.error("loadFriends:", e);
    listEl.innerHTML = '<div style="color:#888;font-size:13px;text-align:center;padding:20px;">Impossible de charger tes amis</div>';
  }
}

function renderFriends() {
  var listEl = document.getElementById("friends-list");
  var search = (document.getElementById("search-input").value || '').trim().toLowerCase();

  var filtered = friends.filter(function(f) {
    if (!search) return true;
    return (f.username || '').toLowerCase().indexOf(search) !== -1;
  });

  if (!filtered.length) {
    listEl.innerHTML = '<div style="color:#666;font-size:13px;text-align:center;padding:20px;">Aucun ami ne correspond</div>';
  } else {
    listEl.innerHTML = filtered.map(function(f) {
      var isSelected = selected.has(f.id);
      var firstLetter = (f.username || '?')[0].toUpperCase();
      var avatarContent = f.avatar_url
        ? '<img src="' + escapeHtml(f.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'
        : firstLetter;

      // ⚡ ATTENTION : pas de <a> ici. La div est cliquable mais ne navigue
      // nulle part. event.stopPropagation+preventDefault au cas où un parent
      // aurait un handler global de redirection.
      return (
        '<div class="friend-row ' + (isSelected ? 'selected' : '') + '" ' +
             'onclick="event.preventDefault();event.stopPropagation();toggleFriend(\'' + f.id + '\');return false;">' +
          '<div class="avatar" style="width:38px;height:38px;font-size:14px;">' + avatarContent + '</div>' +
          '<div style="flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">@' + escapeHtml(f.username) + '</div>' +
          '<div class="check">' + (isSelected ? '✓' : '') + '</div>' +
        '</div>'
      );
    }).join('');
  }

  document.getElementById("selected-count").textContent =
    selected.size + ' sélectionné' + (selected.size > 1 ? 's' : '');

  var allSelected = friends.length > 0 && friends.every(function(f) { return selected.has(f.id); });
  document.getElementById("select-all-label").textContent = allSelected ? '🚫 Aucun' : '✓ Tous';
}

function toggleFriend(userId) {
  if (selected.has(userId)) selected.delete(userId);
  else selected.add(userId);
  renderFriends();
}

function toggleAll() {
  var allSelected = friends.length > 0 && friends.every(function(f) { return selected.has(f.id); });
  if (allSelected) selected.clear();
  else friends.forEach(function(f) { selected.add(f.id); });
  renderFriends();
}

async function createGroup() {
  var name = document.getElementById("group-name").value.trim();
  var description = document.getElementById("group-description").value.trim();

  document.getElementById("error-msg").style.display = 'none';
  document.getElementById("success-msg").style.display = 'none';

  if (!name) {
    showError("error-msg", "⚠️ Le nom du groupe est obligatoire");
    return;
  }

  setLoading("btn-create", true, "Créer le groupe");

  try {
    var { data: createdGroups, error: insertErr } = await db
      .from('groups')
      .insert({
        name: name,
        description: description || null,
        owner_id: currentUser.id
      })
      .select();

    if (insertErr || !createdGroups || !createdGroups.length) {
      console.error("INSERT groups:", insertErr);
      throw new Error("Impossible de créer le groupe : " + (insertErr ? insertErr.message : 'erreur inconnue'));
    }

    var newGroup = createdGroups[0];

    var { error: memberErr } = await db
      .from('group_members')
      .insert({
        group_id: newGroup.id,
        user_id: currentUser.id,
        role: 'admin'
      });
    if (memberErr) console.error("INSERT group_members owner:", memberErr);

    if (selected.size > 0) {
      var memberInserts = Array.from(selected).map(function(uid) {
        return { group_id: newGroup.id, user_id: uid, role: 'member' };
      });
      var { error: addErr } = await db.from('group_members').insert(memberInserts);
      if (addErr) console.error("INSERT group_members:", addErr);
    }

    showSuccess("success-msg", "✅ Groupe \"" + name + "\" créé avec " + (selected.size + 1) + " membre(s) !");

    // ⚡ Lot 4 : gestion du paramètre ?chain=true
    // Si on vient de "create-context.html" → "Nouveau groupe", on enchaîne
    // automatiquement sur la création de série dans ce nouveau groupe.
    var chainCreate = new URLSearchParams(window.location.search).get('chain') === 'true';
    setTimeout(function() {
      if (chainCreate) {
        window.location.href = 'create-series-type.html?group_id=' +
          encodeURIComponent(newGroup.id) + '&group_name=' + encodeURIComponent(name);
      } else {
        window.location.href = 'group-detail.html?id=' + encodeURIComponent(newGroup.id);
      }
    }, 1000);

  } catch (e) {
    console.error("createGroup:", e);
    showError("error-msg", "❌ " + (e.message || "Erreur lors de la création"));
    setLoading("btn-create", false, "Créer le groupe");
  }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

init();
</script>
</body>
</html>
