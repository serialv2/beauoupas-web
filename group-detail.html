<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeauOuPas — Détail groupe</title>
<link rel="stylesheet" href="style.css">
<style>
.tab-row {
  display: flex;
  gap: 6px;
  background: #111;
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 18px;
}
.tab-btn {
  flex: 1;
  padding: 10px 12px;
  background: transparent;
  border: none;
  color: #8A6F4A;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.15s;
  font-family: Arial;
}
.tab-btn.active { background: #C2754C; color: white; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.member-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: #111;
  border: 1px solid #E5DCC9;
  border-radius: 12px;
  margin-bottom: 8px;
}
.member-name { font-weight: 700; }
.member-role {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 999px;
  font-weight: 700;
}
.role-admin { background: rgba(194,117,76,0.15); color: #D88A66; }
.role-member { background: rgba(255,255,255,0.05); color: #8A6F4A; }

.series-card {
  display: block;
  padding: 14px;
  background: #111;
  border: 1px solid #E5DCC9;
  border-radius: 12px;
  margin-bottom: 8px;
  text-decoration: none;
  color: white;
  transition: border-color 0.15s;
}
.series-card:hover { border-color: rgba(194,117,76,0.4); }
.series-card-name { font-weight: 800; margin-bottom: 4px; }
.series-card-meta { font-size: 12px; color: #8A6F4A; display: flex; gap: 10px; }

.chat-box {
  background: #FAF6EF;
  border: 1px solid #E5DCC9;
  border-radius: 14px;
  height: 420px;
  display: flex;
  flex-direction: column;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chat-input-row {
  display: flex;
  gap: 8px;
  padding: 10px;
  border-top: 1px solid #E5DCC9;
}
.chat-msg {
  max-width: 75%;
  padding: 8px 12px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.4;
  word-wrap: break-word;
}
.chat-msg.mine {
  align-self: flex-end;
  background: #C2754C;
  color: white;
  border-bottom-right-radius: 4px;
}
.chat-msg.theirs {
  align-self: flex-start;
  background: #E5DCC9;
  color: white;
  border-bottom-left-radius: 4px;
}
.chat-msg .author { font-size: 11px; font-weight: 700; margin-bottom: 2px; opacity: 0.8; }
.chat-msg .time { font-size: 10px; opacity: 0.6; margin-top: 2px; }
.chat-empty { color: #6B5234; font-size: 13px; text-align: center; padding: 30px 20px; }

/* ─── Modal invite ─── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #FAF6EF;
  border: 1px solid #E5DCC9;
  border-radius: 18px;
  width: 100%;
  max-width: 480px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
}
.modal-header {
  padding: 18px 20px;
  border-bottom: 1px solid #E5DCC9;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-body {
  padding: 16px 20px;
  overflow-y: auto;
  flex: 1;
}
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid #E5DCC9;
  display: flex;
  gap: 10px;
}
.close-btn {
  background: transparent;
  border: none;
  color: #8A6F4A;
  font-size: 22px;
  cursor: pointer;
  padding: 0 6px;
}
.close-btn:hover { color: white; }

.friend-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: #111;
  border: 2px solid #E5DCC9;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 8px;
  user-select: none;
}
.friend-row:hover { border-color: rgba(194,117,76,0.3); }
.friend-row.selected { border-color: #C2754C; background: rgba(194,117,76,0.06); }
.friend-row .check {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid #8A6F4A;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
  transition: all 0.15s;
}
.friend-row.selected .check {
  background: #C2754C;
  border-color: #C2754C;
  color: white;
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">BeauOuPas</div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <a href="create-group.html" class="btn btn-primary btn-full" style="margin-bottom:14px;text-decoration:none;">➕ Nouveau groupe</a>
    <div id="sidebar-user"></div>
  </div>
</aside>
<nav class="bottom-nav" id="bottom-nav"></nav>

<main class="main-content">
  <div style="max-width:700px;margin:0 auto;">

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
      <a href="groups.html" style="color:#8A6F4A;text-decoration:none;font-size:24px;">←</a>
      <h1 id="group-title" style="font-size:22px;font-weight:900;flex:1;">Chargement…</h1>
    </div>

    <div id="group-header"></div>

    <div class="tab-row">
      <button class="tab-btn active" data-tab="series" onclick="switchTab('series')">📋 Séries</button>
      <button class="tab-btn" data-tab="members" onclick="switchTab('members')">👥 Membres</button>
      <button class="tab-btn" data-tab="chat" onclick="switchTab('chat')">💬 Chat</button>
    </div>

    <!-- Séries -->
    <div class="tab-content active" id="tab-series">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="font-size:15px;font-weight:800;color:#8A6F4A;">Séries du groupe</h2>
        <button class="btn btn-sm btn-secondary" onclick="goCreateSeries()">➕ Créer</button>
      </div>
      <div id="series-list"><div class="spinner" style="margin:30px auto;"></div></div>
    </div>

    <!-- Membres -->
    <div class="tab-content" id="tab-members">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="font-size:15px;font-weight:800;color:#8A6F4A;">Membres</h2>
        <!-- ⚡ NOUVEAU : ouvre le modal d'invitation -->
        <button class="btn btn-sm btn-secondary" onclick="openInviteModal()">➕ Inviter</button>
      </div>
      <div id="members-list"></div>
    </div>

    <!-- Chat -->
    <div class="tab-content" id="tab-chat">
      <div class="chat-box">
        <div class="chat-messages" id="chat-messages">
          <div class="chat-empty">Chargement…</div>
        </div>
        <div class="chat-input-row">
          <input type="text" class="input" id="chat-input" placeholder="Écris un message…" maxlength="500" style="flex:1;" onkeydown="if(event.key==='Enter') sendMessage()">
          <button class="btn btn-primary btn-sm" onclick="sendMessage()" style="padding:10px 18px;">➤</button>
        </div>
      </div>
    </div>

    <div id="group-actions" style="margin-top:24px;"></div>

  </div>
</main>

<!-- ⚡ MODAL INVITER -->
<div class="modal-overlay" id="invite-modal" onclick="if(event.target===this) closeInviteModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 style="font-size:18px;font-weight:800;">➕ Inviter des amis</h3>
      <button type="button" class="close-btn" onclick="closeInviteModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="text" class="input" id="invite-search" placeholder="🔎 Rechercher…"
             style="margin-bottom:14px;font-size:14px;padding:10px 14px;"
             oninput="renderInviteList()">
      <div id="invite-friends-list">
        <div class="spinner" style="margin:30px auto;"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" onclick="closeInviteModal()" style="flex:1;">Annuler</button>
      <button type="button" class="btn btn-primary" id="btn-do-invite" onclick="inviteSelected()" style="flex:1;">
        Inviter <span id="invite-count">0</span>
      </button>
    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#FAF6EF;border:1px solid #E5DCC9;color:white;padding:14px 22px;border-radius:14px;font-weight:700;z-index:200;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="navbar.js"></script>
<script>
var currentUser = null;
var currentProfile = null;
var groupId = null;
var groupData = null;
var isAdmin = false;
var members = [];
var seriesList = [];
var messages = [];
var profilesById = {};
var chatChannel = null;

// ⚡ NOUVEAU : pour le modal d'invitation
var availableFriends = [];        // amis non-encore-membres
var inviteSelectedSet = new Set(); // user_ids cochés dans le modal

async function init() {
  groupId = new URLSearchParams(window.location.search).get('id');
  if (!groupId) {
    window.location.href = 'groups.html';
    return;
  }

  currentUser = await requireAuth();
  if (!currentUser) return;

  currentProfile = await getProfile(currentUser.id);
  if (typeof renderNav === "function") renderNav("groups.html");
  if (typeof loadSidebarProfile === "function") loadSidebarProfile();

  await loadAll();
  startRealtime();
}

async function loadAll() {
  try {
    var { data, error } = await db.rpc('get_group_details', {
      p_group_id: groupId,
      p_user_id: currentUser.id
    });

    if (!error && data) {
      var d = Array.isArray(data) ? data[0] : data;
      if (d && d.group) {
        applyGroupDetails(d);
        return;
      }
    }
    console.warn("get_group_details indisponible, fallback manuel:", error);
    await loadAllFallback();
  } catch (e) {
    console.error("loadAll RPC:", e);
    await loadAllFallback();
  }
}

function applyGroupDetails(d) {
  groupData = d.group;
  isAdmin = !!d.is_admin;
  members = d.members || [];
  seriesList = d.series || [];
  messages = d.messages || [];

  members.forEach(function(m) {
    profilesById[m.user_id] = {
      username: m.username || 'Inconnu',
      avatar_url: m.avatar_url
    };
  });

  renderHeader();
  renderSeries();
  renderMembers();
  renderMessages();
  renderActions();
}

async function loadAllFallback() {
  var { data: g } = await db.from('groups').select('*').eq('id', groupId).single();
  if (!g) {
    document.getElementById("group-title").textContent = "Groupe introuvable";
    return;
  }
  groupData = g;

  var { data: rawMembers } = await db
    .from('group_members')
    .select('user_id, role, joined_at, profiles!inner(id, username, avatar_url)')
    .eq('group_id', groupId);

  members = (rawMembers || []).map(function(m) {
    return {
      user_id: m.user_id,
      role: m.role,
      joined_at: m.joined_at,
      username: m.profiles ? m.profiles.username : 'Inconnu',
      avatar_url: m.profiles ? m.profiles.avatar_url : null
    };
  });

  members.forEach(function(m) {
    profilesById[m.user_id] = { username: m.username, avatar_url: m.avatar_url };
  });

  isAdmin = members.some(function(m) {
    return m.user_id === currentUser.id && m.role === 'admin';
  });

  var { data: seriesRaw } = await db
    .from('series')
    .select('*')
    .eq('group_id', groupId)
    .order('created_at', { ascending: false });
  seriesList = seriesRaw || [];

  var { data: msgRaw } = await db
    .from('group_messages')
    .select('*')
    .eq('group_id', groupId)
    .order('created_at', { ascending: false })
    .limit(50);
  messages = (msgRaw || []).reverse();

  renderHeader();
  renderSeries();
  renderMembers();
  renderMessages();
  renderActions();
}

function renderHeader() {
  document.getElementById("group-title").textContent = groupData.name || 'Groupe';

  var firstLetter = (groupData.name || '?')[0].toUpperCase();
  var avatarHtml = groupData.avatar_url
    ? '<img src="' + escapeHtml(groupData.avatar_url) + '" style="width:100%;height:100%;object-fit:cover;border-radius:18px;">'
    : firstLetter;

  var html =
    '<div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:18px;padding:18px;">' +
      '<div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#C2754C,#6B7F5C);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:white;flex-shrink:0;overflow:hidden;">' +
        avatarHtml +
      '</div>' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="font-size:18px;font-weight:800;">' + escapeHtml(groupData.name) + '</div>' +
        (groupData.description
          ? '<div style="font-size:13px;color:#8A6F4A;margin-top:2px;">' + escapeHtml(groupData.description) + '</div>'
          : '') +
        '<div style="font-size:12px;color:#6B5234;margin-top:6px;">👥 ' + members.length + ' membre' + (members.length > 1 ? 's' : '') +
        ' · 📋 ' + seriesList.length + ' série' + (seriesList.length > 1 ? 's' : '') +
        (isAdmin ? ' · <span class="badge badge-pink" style="padding:2px 8px;font-size:10px;">ADMIN</span>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById("group-header").innerHTML = html;
}

function renderSeries() {
  var listEl = document.getElementById("series-list");
  if (!seriesList.length) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px 10px;color:#6B5234;font-size:13px;">Aucune série pour l\'instant.</div>';
    return;
  }
  listEl.innerHTML = seriesList.map(function(s) {
    var statusBadge = '';
    if (s.status === 'active') statusBadge = '<span class="badge badge-green">🔥 ACTIVE</span>';
    else if (s.status === 'finished') statusBadge = '<span class="badge badge-orange">TERMINÉE</span>';
    var isQuiz = s.is_quiz === true;
    var icon = isQuiz ? '🧠' : '🗳️';

    return (
      '<a href="series-detail.html?id=' + encodeURIComponent(s.id) + '" class="series-card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="series-card-name">' + icon + ' ' + escapeHtml(s.title || 'Sans titre') + '</div>' +
            '<div class="series-card-meta">' +
              '<span>' + (isQuiz ? 'Quiz' : 'Vote') + '</span>' +
              (s.access_code ? '<span>Code: <b style="color:#C2754C;">' + escapeHtml(s.access_code) + '</b></span>' : '') +
            '</div>' +
          '</div>' +
          statusBadge +
        '</div>' +
      '</a>'
    );
  }).join('');
}

function renderMembers() {
  var listEl = document.getElementById("members-list");
  if (!members.length) {
    listEl.innerHTML = '<div style="color:#6B5234;font-size:13px;text-align:center;padding:20px;">Aucun membre</div>';
    return;
  }
  listEl.innerHTML = members.map(function(m) {
    var firstLetter = (m.username || '?')[0].toUpperCase();
    var avatarContent = m.avatar_url
      ? '<img src="' + escapeHtml(m.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'
      : firstLetter;
    var roleClass = m.role === 'admin' ? 'role-admin' : 'role-member';
    var roleLabel = m.role === 'admin' ? '👑 Admin' : 'Membre';

    return (
      '<div class="member-row">' +
        '<div class="avatar" style="width:38px;height:38px;font-size:14px;">' + avatarContent + '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div class="member-name">@' + escapeHtml(m.username) + '</div>' +
        '</div>' +
        '<span class="member-role ' + roleClass + '">' + roleLabel + '</span>' +
      '</div>'
    );
  }).join('');
}

function renderMessages() {
  var box = document.getElementById("chat-messages");
  if (!messages.length) {
    box.innerHTML = '<div class="chat-empty">💬 Aucun message pour l\'instant.<br>Sois le premier à écrire !</div>';
    return;
  }
  box.innerHTML = messages.map(function(m) {
    var isMine = m.sender_id === currentUser.id;
    var prof = profilesById[m.sender_id] || { username: 'Inconnu' };
    var time = formatTime(m.created_at);
    return (
      '<div class="chat-msg ' + (isMine ? 'mine' : 'theirs') + '">' +
        (isMine ? '' : '<div class="author">@' + escapeHtml(prof.username) + '</div>') +
        '<div>' + escapeHtml(m.content) + '</div>' +
        '<div class="time">' + time + '</div>' +
      '</div>'
    );
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function renderActions() {
  var html = '';
  if (isAdmin) {
    html += '<button class="btn btn-ghost btn-full" style="border-color:rgba(181,72,47,0.4);color:#B5482F;margin-bottom:8px;" onclick="deleteGroup()">🗑️ Supprimer le groupe</button>';
  } else {
    html += '<button class="btn btn-ghost btn-full" style="border-color:rgba(181,72,47,0.4);color:#B5482F;" onclick="leaveGroup()">🚪 Quitter le groupe</button>';
  }
  document.getElementById("group-actions").innerHTML = html;
}

// ─── Tabs ─────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-content').forEach(function(c) {
    c.classList.toggle('active', c.id === 'tab-' + tab);
  });
  if (tab === 'chat') {
    setTimeout(function() {
      var box = document.getElementById("chat-messages");
      box.scrollTop = box.scrollHeight;
      document.getElementById("chat-input").focus();
    }, 50);
  }
}

// ─── Chat ─────────────────────────────────────────────────
async function sendMessage() {
  var input = document.getElementById("chat-input");
  var content = input.value.trim();
  if (!content) return;

  input.disabled = true;
  try {
    var { error } = await db.from('group_messages').insert({
      group_id: groupId,
      sender_id: currentUser.id,
      content: content
    });
    if (error) {
      console.error("send msg:", error);
      showToast("❌ Erreur d'envoi");
      return;
    }
    input.value = '';
    var localMsg = {
      id: 'local-' + Date.now(),
      group_id: groupId,
      sender_id: currentUser.id,
      content: content,
      created_at: new Date().toISOString()
    };
    if (!messages.some(function(m) { return m.id === localMsg.id; })) {
      messages.push(localMsg);
      renderMessages();
    }
  } catch (e) {
    console.error("send msg:", e);
    showToast("❌ Erreur d'envoi");
  } finally {
    input.disabled = false;
    input.focus();
  }
}

function startRealtime() {
  try {
    if (chatChannel) chatChannel.unsubscribe();
    chatChannel = db.channel('group-msg-' + groupId)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'group_messages',
        filter: 'group_id=eq.' + groupId
      }, function(payload) {
        var newMsg = payload.new;
        if (!newMsg) return;
        if (messages.some(function(m) { return m.id === newMsg.id; })) return;
        messages.push(newMsg);
        renderMessages();
      })
      .subscribe();
  } catch (e) {
    console.error("realtime:", e);
  }
}

// ─── ⚡ MODAL INVITER ─────────────────────────────────────
async function openInviteModal() {
  inviteSelectedSet.clear();
  document.getElementById("invite-search").value = '';
  document.getElementById("invite-modal").classList.add("open");
  document.getElementById("invite-friends-list").innerHTML = '<div class="spinner" style="margin:30px auto;"></div>';

  try {
    // 1. Récupérer mes amis acceptés (mêmes 2 requêtes que create-group)
    var { data: rows1, error: e1 } = await db
      .from('friendships')
      .select('receiver_id')
      .eq('requester_id', currentUser.id)
      .eq('status', 'accepted');
    var { data: rows2, error: e2 } = await db
      .from('friendships')
      .select('requester_id')
      .eq('receiver_id', currentUser.id)
      .eq('status', 'accepted');
    if (e1) console.warn("friendships sent:", e1);
    if (e2) console.warn("friendships received:", e2);

    var friendIds = [];
    (rows1 || []).forEach(function(r) { if (r.receiver_id) friendIds.push(r.receiver_id); });
    (rows2 || []).forEach(function(r) { if (r.requester_id) friendIds.push(r.requester_id); });
    friendIds = Array.from(new Set(friendIds));

    // 2. Filtrer ceux qui sont DÉJÀ membres du groupe
    var memberIds = new Set(members.map(function(m) { return m.user_id; }));
    var inviteIds = friendIds.filter(function(id) { return !memberIds.has(id); });

    if (!inviteIds.length) {
      document.getElementById("invite-friends-list").innerHTML =
        '<div style="text-align:center;padding:30px 10px;color:#6B5234;font-size:14px;">' +
          'Tous tes amis sont déjà membres ! 🎉<br>' +
          '<a href="friends.html" style="color:#C2754C;text-decoration:none;font-weight:700;">Ajoute d\'autres amis</a>' +
        '</div>';
      availableFriends = [];
      updateInviteCount();
      return;
    }

    var { data: profiles, error: pErr } = await db
      .from('profiles')
      .select('id, username, avatar_url')
      .in('id', inviteIds);

    if (pErr) {
      console.error("profiles:", pErr);
      document.getElementById("invite-friends-list").innerHTML =
        '<div style="color:#8A6F4A;text-align:center;padding:20px;">Impossible de charger les profils</div>';
      return;
    }

    availableFriends = (profiles || []).sort(function(a, b) {
      return (a.username || '').toLowerCase().localeCompare((b.username || '').toLowerCase());
    });
    renderInviteList();
  } catch (e) {
    console.error("openInviteModal:", e);
    document.getElementById("invite-friends-list").innerHTML =
      '<div style="color:#8A6F4A;text-align:center;padding:20px;">Erreur de chargement</div>';
  }
}

function closeInviteModal() {
  document.getElementById("invite-modal").classList.remove("open");
}

function renderInviteList() {
  var listEl = document.getElementById("invite-friends-list");
  var search = (document.getElementById("invite-search").value || '').trim().toLowerCase();

  var filtered = availableFriends.filter(function(f) {
    if (!search) return true;
    return (f.username || '').toLowerCase().indexOf(search) !== -1;
  });

  if (!filtered.length) {
    listEl.innerHTML = '<div style="color:#6B5234;font-size:13px;text-align:center;padding:20px;">Aucun ami ne correspond</div>';
  } else {
    listEl.innerHTML = filtered.map(function(f) {
      var isSelected = inviteSelectedSet.has(f.id);
      var firstLetter = (f.username || '?')[0].toUpperCase();
      var avatarContent = f.avatar_url
        ? '<img src="' + escapeHtml(f.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'
        : firstLetter;

      return (
        '<div class="friend-row ' + (isSelected ? 'selected' : '') + '" ' +
             'onclick="event.preventDefault();event.stopPropagation();toggleInvite(\'' + f.id + '\');return false;">' +
          '<div class="avatar" style="width:36px;height:36px;font-size:13px;">' + avatarContent + '</div>' +
          '<div style="flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">@' + escapeHtml(f.username) + '</div>' +
          '<div class="check">' + (isSelected ? '✓' : '') + '</div>' +
        '</div>'
      );
    }).join('');
  }
  updateInviteCount();
}

function toggleInvite(userId) {
  if (inviteSelectedSet.has(userId)) inviteSelectedSet.delete(userId);
  else inviteSelectedSet.add(userId);
  renderInviteList();
}

function updateInviteCount() {
  document.getElementById("invite-count").textContent = inviteSelectedSet.size;
  var btn = document.getElementById("btn-do-invite");
  btn.disabled = inviteSelectedSet.size === 0;
}

async function inviteSelected() {
  if (inviteSelectedSet.size === 0) return;

  var btn = document.getElementById("btn-do-invite");
  btn.disabled = true;
  btn.innerHTML = '⏳ Invitation…';

  try {
    var inserts = Array.from(inviteSelectedSet).map(function(uid) {
      return { group_id: groupId, user_id: uid, role: 'member' };
    });
    var { error } = await db.from('group_members').insert(inserts);

    if (error) {
      console.error("invite:", error);
      showToast("❌ Erreur : " + error.message);
      return;
    }

    var n = inviteSelectedSet.size;
    showToast("✅ " + n + " ami" + (n > 1 ? 's' : '') + " ajouté" + (n > 1 ? 's' : '') + " au groupe");
    closeInviteModal();

    // Recharger la liste de membres pour refléter immédiatement
    await loadAll();
  } catch (e) {
    console.error("invite:", e);
    showToast("❌ Erreur technique");
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Inviter <span id="invite-count">' + inviteSelectedSet.size + '</span>';
  }
}

// ─── Actions ──────────────────────────────────────────────
async function leaveGroup() {
  if (!confirm("Quitter le groupe \"" + groupData.name + "\" ?\nTu pourras le rejoindre à nouveau si on t'invite.")) return;

  try {
    var { error } = await db
      .from('group_members')
      .delete()
      .eq('group_id', groupId)
      .eq('user_id', currentUser.id);

    if (error) {
      console.error("leave:", error);
      showToast("❌ Impossible de quitter");
      return;
    }
    showToast("✅ Tu as quitté le groupe");
    setTimeout(function() { window.location.href = 'groups.html'; }, 800);
  } catch (e) {
    console.error("leave:", e);
    showToast("❌ Erreur");
  }
}

async function deleteGroup() {
  if (!confirm("⚠️ Supprimer DÉFINITIVEMENT le groupe \"" + groupData.name + "\" ?\n\nLes séries du groupe seront déplacées dans \"Mes séries\" (pas perdues), mais le groupe disparaîtra pour tous les membres.")) return;

  try {
    var { data, error } = await db.rpc('delete_group_safe', {
      p_group_id: groupId,
      p_user_id: currentUser.id
    });

    if (error) {
      console.error("delete_group_safe:", error);
      showToast("❌ Erreur : " + error.message);
      return;
    }

    var d = Array.isArray(data) ? data[0] : data;
    if (!d || !d.success) {
      showToast("❌ " + (d && d.message ? d.message : "Échec de la suppression"));
      return;
    }

    var detached = d.detached_series_count || 0;
    showToast("✅ Groupe supprimé" + (detached > 0 ? ' (' + detached + ' série(s) déplacée(s))' : ''));
    setTimeout(function() { window.location.href = 'groups.html'; }, 1000);
  } catch (e) {
    console.error("delete:", e);
    showToast("❌ Erreur technique");
  }
}

function goCreateSeries() {
  var url = 'create-series-type.html?group_id=' + encodeURIComponent(groupId);
  if (groupData && groupData.name) url += '&group_name=' + encodeURIComponent(groupData.name);
  window.location.href = url;
}

// ─── Utils ────────────────────────────────────────────────
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2500);
}

function formatTime(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    if (sameDay) {
      return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }
    return d.getDate() + '/' + (d.getMonth() + 1) + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  } catch(e) { return ''; }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

window.addEventListener('beforeunload', function() {
  if (chatChannel) chatChannel.unsubscribe();
});

init();
</script>
