<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeauOuPas — Groupes</title>
<link rel="stylesheet" href="style.css">
<style>
.group-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px;
  background: #FAF6EF;
  border: 1px solid #E5DCC9;
  border-radius: 18px;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
  color: #3D2817;
  margin-bottom: 12px;
}
.group-card:hover {
  border-color: rgba(194,117,76,0.4);
  transform: translateY(-2px);
}
.group-avatar {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, #C2754C, #6B7F5C);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 900;
  color:#3D2817;
  flex-shrink: 0;
}
.group-name {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.group-meta {
  font-size: 13px;
  color: #8A6F4A;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
}
.empty-state .icon { font-size: 64px; opacity: 0.3; margin-bottom: 16px; }
.empty-state .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.empty-state .desc { color: #6B5234; font-size: 14px; margin-bottom: 24px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">BeauOuPas</div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <a href="create-group.html" class="btn btn-primary btn-full" style="margin-bottom:14px;text-decoration:none;">➕ Nouveau groupe</a>
    <div id="sidebar-user"></div>
  </div>
</aside>
<nav class="bottom-nav" id="bottom-nav"></nav>

<main class="main-content">
  <div style="max-width:700px;margin:0 auto;">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
      <div>
        <h1 style="font-size:28px;font-weight:900;">👥 Mes groupes</h1>
        <p style="color:#6B5234;margin-top:6px;font-size:14px;">Crée des groupes pour partager votes et quiz avec tes amis</p>
      </div>
      <a href="create-group.html" class="btn btn-primary" style="text-decoration:none;">➕ Créer</a>
    </div>

    <div id="groups-container"><div class="spinner"></div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="navbar.js"></script>
<script>
var currentUser = null;

async function init() {
  try {
    currentUser = await requireAuth();
    if (!currentUser) return;

    if (typeof renderNav === "function") renderNav("groups.html");
    if (typeof loadSidebarProfile === "function") loadSidebarProfile();

    await loadGroups();
  } catch (error) {
    console.error("Init groups error:", error);
    document.getElementById("groups-container").innerHTML =
      '<div class="alert alert-error" style="display:block;">Erreur de chargement</div>';
  }
}

async function loadGroups() {
  // ⚡ Utilise la RPC get_my_groups_with_stats qui retourne directement
  // les groupes avec leurs stats (nb membres, nb séries actives) en
  // 1 SEULE requête (sinon il faudrait N+1 requêtes par groupe)
  var container = document.getElementById("groups-container");
  container.innerHTML = '<div class="spinner"></div>';

  try {
    var { data, error } = await db.rpc('get_my_groups_with_stats', {
      p_user_id: currentUser.id
    });

    if (error) {
      console.error("get_my_groups_with_stats:", error);
      // Fallback : si la RPC n'existe pas ou échoue, on charge "à la main"
      return await loadGroupsFallback();
    }

    var groups = data || [];
    if (!groups.length) {
      renderEmpty();
      return;
    }
    renderGroups(groups);
  } catch (e) {
    console.error("loadGroups:", e);
    await loadGroupsFallback();
  }
}

async function loadGroupsFallback() {
  // Plan B si la RPC plante : SELECT direct sur group_members puis groups
  var { data: memberships } = await db
    .from('group_members')
    .select('group_id')
    .eq('user_id', currentUser.id);

  if (!memberships || !memberships.length) {
    renderEmpty();
    return;
  }

  var ids = memberships.map(function(m) { return m.group_id; });
  var { data: groups } = await db
    .from('groups')
    .select('*')
    .in('id', ids)
    .order('created_at', { ascending: false });

  renderGroups((groups || []).map(function(g) {
    return {
      id: g.id,
      name: g.name,
      description: g.description,
      avatar_url: g.avatar_url,
      members_count: '?',
      active_series_count: '?'
    };
  }));
}

function renderGroups(groups) {
  var container = document.getElementById("groups-container");
  container.innerHTML = groups.map(function(g) {
    var firstLetter = (g.name || '?')[0].toUpperCase();
    var avatarContent = g.avatar_url
      ? '<img src="' + escapeHtml(g.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">'
      : firstLetter;

    var members = g.members_count || g.members || 0;
    var activeSeries = g.active_series_count || g.active_series || 0;

    return (
      '<a href="group-detail.html?id=' + encodeURIComponent(g.id) + '" class="group-card fade-in">' +
        '<div class="group-avatar">' + avatarContent + '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div class="group-name">' + escapeHtml(g.name) + '</div>' +
          '<div class="group-meta">' +
            '<span>👤 ' + members + ' membre' + (members > 1 ? 's' : '') + '</span>' +
            (activeSeries > 0
              ? '<span style="color:#4A7A52;font-weight:700;">🔥 ' + activeSeries + ' série' + (activeSeries > 1 ? 's' : '') + ' active' + (activeSeries > 1 ? 's' : '') + '</span>'
              : '<span>Aucune série active</span>') +
          '</div>' +
        '</div>' +
        '<span style="font-size:24px;color:#C2754C;">→</span>' +
      '</a>'
    );
  }).join('');
}

function renderEmpty() {
  var container = document.getElementById("groups-container");
  container.innerHTML =
    '<div class="empty-state card">' +
      '<div class="icon">👥</div>' +
      '<div class="title">Aucun groupe pour l\'instant</div>' +
      '<div class="desc">Crée ton premier groupe pour partager des votes et quiz avec tes amis</div>' +
      '<a href="create-group.html" class="btn btn-primary" style="text-decoration:none;">➕ Créer mon premier groupe</a>' +
    '</div>';
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

init();
</script>
</body>
</html>
