<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeauOuPas — Groupes</title>
<link rel="stylesheet" href="style.css">
<style>
/* ─── Onglets (identique à l'app MAUI) ─── */
.tabs-row {
  display: flex;
  gap: 8px;
  background: #FAF6EF;
  padding: 5px;
  border-radius: 14px;
  margin-bottom: 22px;
}
.tab-btn {
  flex: 1;
  padding: 12px 14px;
  background: #E5DCC9;
  border: none;
  color: #8A6F4A;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.15s;
  font-family: Arial, sans-serif;
}
.tab-btn.active { background: #C2754C; color: #FFFFFF; }

/* ─── Cartes groupe ─── */
.group-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px;
  background: #FAF6EF;
  border: 1px solid #E5DCC9;
  border-radius: 18px;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
  color: #3D2817;
  margin-bottom: 12px;
}
.group-card:hover {
  border-color: rgba(194,117,76,0.4);
  transform: translateY(-2px);
}
.group-avatar {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, #C2754C, #6B7F5C);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 900;
  color:#FFFFFF;
  flex-shrink: 0;
}
.group-name {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.group-meta {
  font-size: 13px;
  color: #8A6F4A;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* ─── Lignes série (onglet Mes Séries) ─── */
.series-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #FAF6EF;
  border: 1px solid #E5DCC9;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 8px;
  text-decoration: none;
  color: #3D2817;
  transition: all 0.15s;
}
.series-row:hover { border-color: rgba(194,117,76,0.4); transform: translateY(-1px); }
.series-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.series-icon.vote { background: linear-gradient(135deg,#C2754C,#A35C36); }
.series-icon.quiz { background: linear-gradient(135deg,#6B7F5C,#566649); }
.series-name { font-weight: 800; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.series-meta { font-size: 12px; color: #8A6F4A; display: flex; gap: 10px; flex-wrap: wrap; }

/* ─── État vide ─── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
}
.empty-state .icon { font-size: 64px; opacity: 0.3; margin-bottom: 16px; }
.empty-state .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.empty-state .desc { color: #6B5234; font-size: 14px; margin-bottom: 24px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">BeauOuPas</div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <a href="create-group.html" class="btn btn-primary btn-full" style="margin-bottom:14px;text-decoration:none;">➕ Nouveau groupe</a>
    <div id="sidebar-user"></div>
  </div>
</aside>
<nav class="bottom-nav" id="bottom-nav"></nav>

<main class="main-content">
  <div style="max-width:700px;margin:0 auto;">

    <!-- En-tête + bouton contextuel -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
      <div>
        <h1 id="page-title" style="font-size:28px;font-weight:900;">👥 Mes groupes</h1>
        <p id="page-sub" style="color:#6B5234;margin-top:6px;font-size:14px;">Crée des groupes pour partager votes et quiz avec tes amis</p>
      </div>
      <a id="header-action" href="create-group.html" class="btn btn-primary" style="text-decoration:none;">➕ Créer</a>
    </div>

    <!-- Onglets -->
    <div class="tabs-row">
      <button class="tab-btn active" id="tab-groups" onclick="showTab(0)">👥 Groupes</button>
      <button class="tab-btn" id="tab-series" onclick="showTab(1)">📋 Mes Séries</button>
    </div>

    <!-- Onglet 0 : Groupes -->
    <div id="content-groups">
      <div id="groups-container"><div class="spinner"></div></div>
    </div>

    <!-- Onglet 1 : Mes Séries -->
    <div id="content-series" style="display:none;">
      <div id="series-container"><div class="spinner"></div></div>
    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="navbar.js"></script>
<script>
var currentUser = null;
var seriesLoaded = false;   // chargement paresseux de l'onglet Mes Séries

async function init() {
  try {
    currentUser = await requireAuth();
    if (!currentUser) return;

    if (typeof renderNav === "function") renderNav("groups.html");
    if (typeof loadSidebarProfile === "function") loadSidebarProfile();

    await loadGroups();
  } catch (error) {
    console.error("Init groups error:", error);
    document.getElementById("groups-container").innerHTML =
      '<div class="alert alert-error" style="display:block;">Erreur de chargement</div>';
  }
}

// ─── Gestion des onglets (logique identique à l'app MAUI) ───
function showTab(index) {
  var isGroups = index === 0;

  document.getElementById("content-groups").style.display = isGroups ? "block" : "none";
  document.getElementById("content-series").style.display = isGroups ? "none" : "block";

  document.getElementById("tab-groups").classList.toggle("active", isGroups);
  document.getElementById("tab-series").classList.toggle("active", !isGroups);

  // En-tête + bouton contextuels
  var title = document.getElementById("page-title");
  var sub = document.getElementById("page-sub");
  var action = document.getElementById("header-action");

  if (isGroups) {
    title.textContent = "👥 Mes groupes";
    sub.textContent = "Crée des groupes pour partager votes et quiz avec tes amis";
    action.textContent = "➕ Créer";
    action.setAttribute("href", "create-group.html");
  } else {
    title.textContent = "📋 Mes séries";
    sub.textContent = "Tes séries sans groupe (créées ou rejointes via un code)";
    action.textContent = "➕ Créer";
    action.setAttribute("href", "create-series-type.html");

    // Chargement paresseux : on ne charge qu'au premier affichage
    if (!seriesLoaded) {
      seriesLoaded = true;
      loadStandaloneSeries();
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   ONGLET 0 — GROUPES
   ═══════════════════════════════════════════════════════════ */
async function loadGroups() {
  var container = document.getElementById("groups-container");
  container.innerHTML = '<div class="spinner"></div>';

  try {
    var { data, error } = await db.rpc('get_my_groups_with_stats', {
      p_user_id: currentUser.id
    });

    if (error) {
      console.error("get_my_groups_with_stats:", error);
      return await loadGroupsFallback();
    }

    var groups = data || [];
    if (!groups.length) {
      renderGroupsEmpty();
      return;
    }
    renderGroups(groups);
  } catch (e) {
    console.error("loadGroups:", e);
    await loadGroupsFallback();
  }
}

async function loadGroupsFallback() {
  var { data: memberships } = await db
    .from('group_members')
    .select('group_id')
    .eq('user_id', currentUser.id);

  if (!memberships || !memberships.length) {
    renderGroupsEmpty();
    return;
  }

  var ids = memberships.map(function(m) { return m.group_id; });
  var { data: groups } = await db
    .from('groups')
    .select('*')
    .in('id', ids)
    .order('created_at', { ascending: false });

  renderGroups((groups || []).map(function(g) {
    return {
      id: g.id,
      name: g.name,
      description: g.description,
      avatar_url: g.avatar_url,
      members_count: '?',
      active_series_count: '?'
    };
  }));
}

function renderGroups(groups) {
  var container = document.getElementById("groups-container");
  container.innerHTML = groups.map(function(g) {
    var firstLetter = (g.name || '?')[0].toUpperCase();
    var avatarContent = g.avatar_url
      ? '<img src="' + escapeHtml(g.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">'
      : firstLetter;

    var members = g.members_count || g.members || 0;
    var activeSeries = g.active_series_count || g.active_series || 0;

    return (
      '<a href="group-detail.html?id=' + encodeURIComponent(g.id) + '" class="group-card fade-in">' +
        '<div class="group-avatar">' + avatarContent + '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div class="group-name">' + escapeHtml(g.name) + '</div>' +
          '<div class="group-meta">' +
            '<span>👤 ' + members + ' membre' + (members > 1 ? 's' : '') + '</span>' +
            (activeSeries > 0
              ? '<span style="color:#4A7A52;font-weight:700;">🔥 ' + activeSeries + ' série' + (activeSeries > 1 ? 's' : '') + ' active' + (activeSeries > 1 ? 's' : '') + '</span>'
              : '<span>Aucune série active</span>') +
          '</div>' +
        '</div>' +
        '<span style="font-size:24px;color:#C2754C;">→</span>' +
      '</a>'
    );
  }).join('');
}

function renderGroupsEmpty() {
  document.getElementById("groups-container").innerHTML =
    '<div class="empty-state card">' +
      '<div class="icon">👥</div>' +
      '<div class="title">Aucun groupe pour l\'instant</div>' +
      '<div class="desc">Crée ton premier groupe pour partager des votes et quiz avec tes amis</div>' +
      '<a href="create-group.html" class="btn btn-primary" style="text-decoration:none;">➕ Créer mon premier groupe</a>' +
    '</div>';
}

/* ═══════════════════════════════════════════════════════════
   ONGLET 1 — MES SÉRIES (standalone)
   Utilise la RPC get_my_standalone_series — MÊME logique que l'app MAUI.
   Retourne les séries standalone où je suis créateur OU participant.
   ═══════════════════════════════════════════════════════════ */
async function loadStandaloneSeries() {
  var container = document.getElementById("series-container");
  container.innerHTML = '<div class="spinner"></div>';

  try {
    var { data, error } = await db.rpc('get_my_standalone_series');

    if (error) {
      console.error("get_my_standalone_series:", error);
      container.innerHTML =
        '<div class="alert alert-error" style="display:block;">Erreur de chargement des séries</div>';
      return;
    }

    var series = data || [];
    if (!series.length) {
      renderSeriesEmpty();
      return;
    }
    renderSeries(series);
  } catch (e) {
    console.error("loadStandaloneSeries:", e);
    container.innerHTML =
      '<div class="alert alert-error" style="display:block;">Erreur de chargement des séries</div>';
  }
}

function renderSeries(series) {
  var container = document.getElementById("series-container");
  container.innerHTML = series.map(function(s) {
    var isQuiz = !!s.is_quiz;
    var icon = isQuiz ? '🧠' : '🗳️';
    var iconClass = isQuiz ? 'quiz' : 'vote';

    var statusBadge = '';
    if (s.status === 'preparing') {
      statusBadge = '<span class="badge badge-orange">⏳ En préparation</span>';
    } else if (s.status === 'active') {
      statusBadge = '<span class="badge badge-green">🔥 EN COURS</span>';
    } else if (s.status === 'finished') {
      statusBadge = '<span style="color:#8A6F4A;font-size:11px;">✅ Terminée</span>';
    }

    var meta = [];
    meta.push(isQuiz ? 'Quiz' : 'Vote');
    if (s.access_code) {
      meta.push('Code: <b style="color:#C2754C;">' + escapeHtml(s.access_code) + '</b>');
    }

    var amCreator = s.creator_id === currentUser.id;

    return (
      '<a href="series-detail.html?id=' + encodeURIComponent(s.id) + '" class="series-row fade-in">' +
        '<div class="series-icon ' + iconClass + '">' + icon + '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div class="series-name">' +
            escapeHtml(s.title || 'Sans titre') +
            (amCreator ? ' <span style="font-size:10px;color:#C2754C;">👑</span>' : '') +
          '</div>' +
          '<div class="series-meta">' + meta.join(' · ') + '</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;align-items:end;gap:6px;">' +
          statusBadge +
        '</div>' +
      '</a>'
    );
  }).join('');
}

function renderSeriesEmpty() {
  document.getElementById("series-container").innerHTML =
    '<div class="empty-state card">' +
      '<div class="icon">📋</div>' +
      '<div class="title">Aucune série sans groupe</div>' +
      '<div class="desc">Crée une série autonome ou rejoins-en une avec un code d\'accès</div>' +
      '<a href="create-series-type.html" class="btn btn-primary" style="text-decoration:none;">➕ Créer une série</a>' +
    '</div>';
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

init();
</script>
</body>
</html>
